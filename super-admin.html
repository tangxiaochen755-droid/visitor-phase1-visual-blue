<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一期 · 超级管理员</title>
<link href="./assets/remixicon/remixicon.css" rel="stylesheet">
<style>
*{box-sizing:border-box}html{-webkit-font-smoothing:antialiased}body{margin:0;background:#f3f4f6;color:#202328;font:14px "PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}button,input,select{font:inherit}button{cursor:pointer;transition:transform .16s,background-color .16s}button:active{transform:scale(.96)}aside{position:fixed;inset:0 auto 0 0;width:220px;background:#25292e;color:#fff}.brand{height:56px;border-bottom:1px solid #3c4148;display:flex;align-items:center;padding:0 18px;font-weight:600}.group{color:#7f858d;font-size:11px;padding:22px 18px 8px}.nav{margin:0 10px;padding:10px 12px;background:#f1f2f3;color:#222;border-radius:4px;display:flex;align-items:center;gap:9px}.nav i{font-size:17px;line-height:1}header{position:fixed;left:220px;right:0;height:56px;background:#fff;border-bottom:1px solid #d9dde1;padding:0 18px;display:flex;align-items:center}header>.ri-menu-line{font-size:19px;margin-right:12px;color:#5e646b}header span{margin-left:auto;color:#666;display:flex;align-items:center;gap:5px}header span i{font-size:17px}main{margin-left:220px;padding:76px 18px 30px}.head{display:flex;align-items:flex-end;margin-bottom:14px}.head h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#767c83}.actions{margin-left:auto}.btn{min-height:32px;border:1px solid #cbd0d5;background:#fff;border-radius:4px;padding:0 13px;margin-left:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn i{font-size:16px}.btn.primary{background:#30343a;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.card,.panel,.filter{background:#fff;border:1px solid #d9dde1;border-radius:6px}.card{padding:15px}.card label{font-size:12px;color:#676d74}.card b{display:block;font:28px Georgia;margin:8px 0 2px}.card small{color:#888}.filter{padding:13px;margin-bottom:12px;display:flex;gap:10px}input,select{height:32px;border:1px solid #cdd1d6;border-radius:4px;padding:0 9px}.panel-head{height:45px;padding:0 14px;border-bottom:1px solid #eceef0;display:flex;align-items:center;font-weight:600}.panel-head span{margin-left:auto;color:#777;font-size:12px;font-weight:400}table{width:100%;border-collapse:collapse}th{text-align:left;background:#f7f8f9;color:#5e646c;font-size:12px;font-weight:500;padding:10px;border-bottom:1px solid #d9dde1}td{padding:11px 10px;border-bottom:1px solid #eceef0}.tag{border:1px solid #b9c4bd;background:#f1f5f2;color:#405e4d;padding:2px 7px;font-size:12px}.warn{border-color:#d4c39f;background:#f8f4ec;color:#765a2c}.link{border:0;background:none;min-height:40px;padding:0 8px;color:#3c4249}.empty{text-align:center;color:#888;padding:42px}.modal-mask{position:fixed;inset:0;background:rgba(20,23,27,.32);display:none;place-items:center;z-index:10}.modal-mask.open{display:grid}.modal{width:520px;background:#fff;border-radius:7px;box-shadow:0 18px 55px rgba(0,0,0,.2)}.modal-head,.modal-foot{padding:12px 18px;display:flex;align-items:center;border-bottom:1px solid #e2e4e7}.modal-foot{justify-content:flex-end;border:0;border-top:1px solid #e2e4e7}.modal-head button{margin-left:auto;border:0;background:none;width:40px;height:40px;font-size:20px;display:grid;place-items:center}.modal-body{padding:18px}.row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;margin-bottom:13px}.row input,.row select{width:100%}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-10px);padding:10px 16px;background:#292d32;color:#fff;border-radius:4px;opacity:0;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* TASK-006 · 超级管理端同步企业后台视觉规范 */
:root{--side:220px;--primary:#126df4;--primary-hover:#0b5fd7;--ink:#112d52;--muted:#788ba3;--line:#dce7f3;--line-soft:#edf3f8;--page:#f8fbff;--success:#05603a;--warning:#854a0e;--danger:#b42318}
body{background:var(--page);color:var(--ink)}
aside{width:var(--side);background:#fff;color:#17335c;border-right:1px solid #e3ebf4;box-shadow:none;z-index:3}
.brand{height:64px;padding:0 20px;border-color:#edf2f7;color:#102d55;font-size:16px;font-weight:600;gap:10px}.brand:before{content:"访";width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(145deg,#1478ff,#3e93ff);color:#fff;font-size:15px;font-weight:700}.group{padding:20px 18px 7px;color:#91a0b2;font-size:12px}.nav{height:44px;margin:2px 10px;padding:0 14px;border-radius:7px;background:transparent;color:#18345d}.nav:hover{background:#f2f7ff;color:var(--primary)}.nav i{width:22px;color:#56718f;font-size:18px}.nav{background:linear-gradient(110deg,#1168ee,#1979ff);color:#fff;box-shadow:0 8px 20px rgba(18,109,244,.18)}.nav i{color:#fff}
header{left:var(--side);height:64px;padding:0 22px;border-color:#e4edf6;color:#687e96;z-index:2}header>.ri-menu-line{color:#58728d}header span{color:#526c86}
main{margin-left:var(--side);padding:84px 20px 28px;max-width:1920px}.head{align-items:center;margin-bottom:16px}.head h1{font-size:22px;line-height:30px;margin:0 0 3px;color:#102d55}.sub{color:#7d91a7;font-size:12px;line-height:18px}.actions{display:flex;gap:8px}.actions .btn,.filter .btn,.modal-foot .btn{margin-left:0}
.btn{min-height:36px;padding:0 14px;border-color:#cbdced;border-radius:6px;background:#fff;color:#405f7d;transition:background-color .18s,border-color .18s,color .18s,box-shadow .18s,transform .12s}.btn:hover{border-color:#78ade5;color:#176dcc;background:#f7fbff}.btn:focus-visible,.link:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(18,109,244,.18);outline-offset:1px}.btn.primary{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 5px 12px rgba(18,109,244,.18)}.btn.primary:hover{border-color:var(--primary-hover);background:var(--primary-hover);color:#fff}.btn:disabled{cursor:not-allowed;opacity:.5;box-shadow:none}
.cards{gap:12px;margin-bottom:12px}.card,.panel,.filter{border-color:var(--line);border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(30,70,110,.04)}.card{min-height:108px;padding:16px 18px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;right:-18px;top:-26px;width:82px;height:82px;border-radius:50%;background:#edf5ff}.card label{position:relative;z-index:1;color:#657b92;font-size:13px}.card b{position:relative;z-index:1;margin:6px 0 2px;color:#15375b;font:600 28px/36px "PingFang SC","Microsoft YaHei",sans-serif}.card small{position:relative;z-index:1;color:#8799ab;font-size:12px}
.filter{padding:12px 16px;gap:8px;align-items:center}.filter input{width:240px!important}.filter input,.filter select{height:36px;border-color:#cbdced;border-radius:6px;background:#fff;color:#294865}.filter input:hover,.filter select:hover{border-color:#9bbfe2}.filter input:focus,.filter select:focus{border-color:#438ee6;box-shadow:0 0 0 3px rgba(23,107,219,.1);outline:0}.filter input::placeholder{color:#9aaabd}
.panel{overflow-x:auto}.panel-head{height:46px;padding:0 16px;border-color:var(--line-soft);color:#234768;font-size:15px}.panel-head span{color:#8496a8}table{min-width:980px}th{height:42px;padding:0 12px;background:#f5f8fc;border-color:var(--line);color:#60758d;font-size:13px;font-weight:500;white-space:nowrap}td{height:48px;padding:0 12px;border-color:var(--line-soft);white-space:nowrap}tbody tr:hover{background:#f7fbff}th:first-child,td:first-child{padding-left:16px}th:last-child,td:last-child{width:128px;padding-right:16px;text-align:center}
.tenant-logo{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:#e9f3ff;color:#176dcc;font-weight:600}.tag{display:inline-flex;align-items:center;min-height:24px;padding:2px 8px;border-width:1px;border-style:solid;border-radius:5px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}.tag.success{color:var(--success);background:#d1fadf;border-color:#32d583}.tag.warn{color:var(--warning);background:#fef0c7;border-color:#f79009}.tag.bad{color:var(--danger);background:#fee4e2;border-color:#f97066}.link{min-height:36px;padding:0 7px;color:#126df4;white-space:nowrap}.link:hover{color:#0b5fc7;background:#eaf3ff;border-radius:5px}
.modal-mask{background:rgba(21,55,87,.32);backdrop-filter:blur(2px)}.modal{width:540px;max-width:calc(100vw - 40px);border:1px solid #cfe0ef;border-radius:10px;box-shadow:0 24px 70px rgba(27,74,119,.24);overflow:hidden}.modal-head{min-height:52px;padding:0 12px 0 20px;border-color:var(--line);background:#f8fbff}.modal-head b{font-size:16px;color:#173653}.modal-foot{min-height:60px;padding:10px 20px;gap:8px;border-color:var(--line)}.modal-body{padding:20px}.row{grid-template-columns:112px minmax(0,1fr);gap:12px;margin-bottom:16px}.row:last-child{margin-bottom:0}.row label{color:#405b76}.row input,.row select{height:36px;border-color:#cbdced;border-radius:6px;background:#fff;color:#294865}.row input:disabled,.row select:disabled{background:#f3f6f9;color:#76899c}.form-help{margin:-6px 0 16px 124px;color:#7d91a7;font-size:12px;line-height:18px}.toast{top:76px;border-radius:7px;background:#173d66;box-shadow:0 8px 24px rgba(20,61,102,.2)}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.panel{overflow-x:auto}}@media(max-width:760px){:root{--side:0px}aside{display:none}header{left:0}.cards{grid-template-columns:1fr 1fr}main{padding-left:14px;padding-right:14px}.head{align-items:flex-start;gap:12px}.filter{flex-wrap:wrap}.filter input{width:100%!important}.modal{max-width:calc(100vw - 24px)}}
</style></head>
<body><aside><div class="brand">访客平台 · 超级管理员</div><div class="group">平台管理</div><div class="nav"><i class="ri-building-4-line"></i>租户管理</div></aside><header><i class="ri-menu-line"></i>平台管理 / 租户管理<span>超级管理员<i class="ri-arrow-down-s-line"></i></span></header><main>
<div class="head"><div><h1>租户管理</h1><div class="sub">一期仅管理租户基础资料、服务结束日期、到期前短信提醒与续租</div></div><div class="actions"><button class="btn" onclick="toast('租户数据导出任务已创建')"><i class="ri-download-2-line"></i>导出</button><button class="btn primary" onclick="tenantModal()"><i class="ri-add-line"></i>新增租户</button></div></div>
<div class="cards"><div class="card"><label>租户总数</label><b>36</b><small>正常 32 家</small></div><div class="card"><label>30 天内到期</label><b>3</b><small>待跟进</small></div><div class="card"><label>已过期</label><b>1</b><small>已限制登录</small></div><div class="card"><label>本月续租</label><b>5</b><small>已更新服务日期</small></div></div>
<div class="filter"><input id="tenantSearch" placeholder="租户名称 / 租户账号" style="width:220px" onkeydown="if(event.key==='Enter')filterTenants()"><select id="tenantStatus"><option>全部状态</option><option>正常</option><option>即将到期</option><option>已过期</option></select><button class="btn primary" onclick="filterTenants()"><i class="ri-search-line"></i>查询</button><button class="btn" onclick="resetFilter()"><i class="ri-refresh-line"></i>重置</button></div>
<div class="panel"><div class="panel-head">租户列表<span>共 36 个租户</span></div><table><thead><tr><th>租户账号</th><th>租户名称</th><th>Logo</th><th>服务结束日期</th><th>提醒方式</th><th>管理员</th><th>状态</th><th>操作</th></tr></thead><tbody>
<tr><td>huachen</td><td>华辰科技有限公司</td><td><span class="tenant-logo">华</span></td><td>2027-07-29</td><td>提前 30/7 天短信</td><td>陈晓</td><td><span class="tag success">正常</span></td><td><button class="link" onclick="tenantModal('华辰科技有限公司','huachen')">编辑</button><button class="link" onclick="renew('华辰科技有限公司','2027-07-29')">续租</button></td></tr>
<tr><td>yuanxing</td><td>远星智能制造有限公司</td><td><span class="tenant-logo">远</span></td><td>2026-08-18</td><td>提前 30/7/1 天短信</td><td>刘楠</td><td><span class="tag warn">即将到期</span></td><td><button class="link" onclick="tenantModal('远星智能制造有限公司','yuanxing')">编辑</button><button class="link" onclick="renew('远星智能制造有限公司','2026-08-18')">续租</button></td></tr>
<tr><td>qiming</td><td>启明商务服务有限公司</td><td><span class="tenant-logo">启</span></td><td>2026-06-30</td><td>提前 30 天短信</td><td>王倩</td><td><span class="tag bad">已过期</span></td><td><button class="link" onclick="tenantModal('启明商务服务有限公司','qiming',true)">查看</button><button class="link" onclick="renew('启明商务服务有限公司','2026-06-30')">续租</button></td></tr>
</tbody></table></div>
</main>
<div class="modal-mask" id="mask" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><b id="modalTitle">租户</b><button onclick="closeModal()" aria-label="关闭"><i class="ri-close-line"></i></button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div><div class="toast" id="toast"></div>
<script>
let timer;
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),2200)}
function openModal(title,body,foot){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalBody').innerHTML=body;document.querySelector('#modalFoot').innerHTML=foot;document.querySelector('#mask').classList.add('open')}
function closeModal(){document.querySelector('#mask').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function strongPassword(){return `Vms@${new Date().getFullYear()}${Math.floor(Math.random()*9000+1000)}`}
function tenantModal(name='',account='',readonly=false){const editing=Boolean(name);openModal(readonly?'租户详情':editing?'编辑租户':'新增租户',`<div class="row"><label>租户账号</label><input id="account" value="${account}" ${account?'disabled':''}></div><div class="row"><label>租户名称</label><input id="name" value="${name}" ${readonly?'disabled':''}></div><div class="row"><label>管理员姓名</label><input value="${name?'陈晓':''}" ${readonly?'disabled':''}></div><div class="row"><label>管理员手机</label><input value="${name?'13800002091':''}" ${readonly?'disabled':''}></div><div class="row"><label>${editing?'管理员密码':'初始密码'}</label><input value="${editing?'••••••••••••':strongPassword()}" disabled></div><div class="form-help">默认使用强密码，管理员首次登录必须修改密码。</div><div class="row"><label>服务结束日期</label><input type="date" value="2027-07-29" ${readonly?'disabled':''}></div><div class="row"><label>到期提醒</label><select ${readonly?'disabled':''}><option>提前 30/7 天短信</option><option>提前 30/7/1 天短信</option></select></div>`,readonly?`<button class="btn" onclick="closeModal()">关闭</button>`:`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveTenant('${editing?'修改':'新增'}')">保存</button>`)}
function saveTenant(type){if(!document.querySelector('#account').value.trim()||!document.querySelector('#name').value.trim()){toast('请填写租户账号和租户名称');return}closeModal();toast(`租户${type}成功；管理员首次登录须修改密码`)}
function renew(name,date){openModal('租户续租',`<div class="row"><label>租户</label><div>${name}</div></div><div class="row"><label>当前到期日</label><div>${date}</div></div><div class="row"><label>续租后到期日</label><input type="date" value="2027-08-18"></div><div class="row"><label>续租备注</label><input placeholder="请输入合同或订单说明"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="closeModal();toast('续租成功，服务日期已更新')">确认续租</button>`)}
function filterTenants(){const q=document.querySelector('#tenantSearch').value.trim().toLowerCase(),s=document.querySelector('#tenantStatus').value;let count=0;document.querySelectorAll('tbody tr').forEach(tr=>{const show=(!q||tr.textContent.toLowerCase().includes(q))&&(s==='全部状态'||tr.textContent.includes(s));tr.style.display=show?'':'none';if(show)count++});document.querySelector('.panel-head span').textContent=`当前 ${count} 个租户`}
function resetFilter(){document.querySelector('#tenantSearch').value='';document.querySelector('#tenantStatus').selectedIndex=0;filterTenants();toast('筛选条件已重置')}
</script></body></html>
