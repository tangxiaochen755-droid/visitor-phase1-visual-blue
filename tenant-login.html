<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>远星智造 · 访客管理平台</title>
<link href="./assets/remixicon/remixicon.css" rel="stylesheet">
<style>
:root{--primary:#176bdb;--primary-hover:#0f56b7;--ink:#17324d;--muted:#70869b;--line:#d8e5f0}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#dfeaf4}button,input{font:inherit}
.login-page{min-height:100%;position:relative;overflow:hidden;background:#dbeafa url('./assets/tenant-login-bg-common-v1.webp') center/cover no-repeat}.login-page:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,35,66,.7) 0%,rgba(11,47,83,.48) 42%,rgba(229,240,250,.28) 67%,rgba(239,247,253,.62) 100%)}.login-page:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,26,50,.17),transparent 30%,rgba(4,27,51,.24));pointer-events:none}
.brand{position:absolute;z-index:2;top:42px;left:54px;display:flex;align-items:center;gap:14px;color:#fff;text-shadow:0 2px 12px rgba(5,29,53,.24)}.brand-logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;overflow:hidden;background:#fff;box-shadow:0 12px 30px rgba(0,34,78,.27),inset 0 0 0 1px rgba(255,255,255,.54);font-size:26px;font-weight:700}.brand-logo img{width:100%;height:100%;padding:5px;object-fit:contain}.brand-logo img.is-default{width:142%;height:142%;max-width:none;padding:0}.brand-copy b{display:block;font-size:23px;line-height:1.25;letter-spacing:.02em}.brand-copy span{display:block;margin-top:4px;font-size:12px;color:rgba(255,255,255,.78);letter-spacing:.12em}
.hero-copy{position:absolute;z-index:2;left:7.5vw;top:50%;width:min(500px,40vw);transform:translateY(-47%);color:#fff;text-shadow:0 3px 20px rgba(4,29,56,.3)}.hero-copy .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:18px;color:rgba(255,255,255,.78);font-size:13px;letter-spacing:.16em}.hero-copy .eyebrow:before{content:"";width:28px;height:2px;background:#76bdff}.hero-copy h1{margin:0;font-size:42px;line-height:1.24;letter-spacing:-.04em}.hero-copy p{max-width:430px;margin:18px 0 0;color:rgba(255,255,255,.82);font-size:16px;line-height:1.9}.service-points{display:flex;gap:18px;margin-top:28px}.service-point{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.88);font-size:13px}.service-point i{font-size:18px;color:#8ecaff}
.login-shell{position:relative;z-index:3;min-height:100vh;display:flex;align-items:center;justify-content:flex-end;padding:48px clamp(58px,8vw,132px) 48px 52px}.login-card{width:420px;padding:36px 38px 32px;border:1px solid rgba(255,255,255,.86);border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 28px 80px rgba(13,54,91,.23);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.login-card h2{margin:0;font-size:27px;letter-spacing:-.02em}.login-card>.hint{margin:8px 0 26px;color:var(--muted);font-size:13px}.field{margin-bottom:17px}.field label{display:block;margin:0 0 8px;color:#35526e;font-size:13px;font-weight:600}.input-wrap{height:48px;border:1px solid var(--line);border-radius:10px;background:#fbfdff;display:flex;align-items:center;padding:0 13px;color:#7d92a6;transition:.18s}.input-wrap:focus-within{border-color:#438ee6;background:#fff;box-shadow:0 0 0 3px rgba(23,107,219,.11)}.input-wrap i{font-size:19px}.input-wrap input{width:100%;height:46px;border:0;outline:0;background:transparent;padding:0 10px;color:var(--ink);font-size:15px}.input-wrap input::placeholder{color:#9aabba}.captcha-row{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px}.captcha{height:48px;border:1px solid #d6e2ed;border-radius:10px;background:repeating-linear-gradient(-12deg,#f3f8fc 0 7px,#e9f2f9 8px 9px);display:grid;place-items:center;color:#235fa2;font:italic 700 21px Georgia;letter-spacing:5px;user-select:none}.options{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px;color:#60778d;font-size:13px}.remember{display:flex;align-items:center;gap:7px}.remember input{width:16px;height:16px;accent-color:var(--primary)}.link{border:0;background:none;padding:5px;color:var(--primary);cursor:pointer}.submit{width:100%;height:48px;border:0;border-radius:10px;background:linear-gradient(135deg,#2d83ed,#176bdb);color:#fff;font-size:15px;font-weight:650;box-shadow:0 10px 22px rgba(23,107,219,.23);cursor:pointer;transition:.18s}.submit:hover{background:linear-gradient(135deg,#2477dc,#0f56b7);transform:translateY(-1px)}.submit:focus-visible,.link:focus-visible{outline:3px solid rgba(23,107,219,.25);outline-offset:2px}.support{margin:20px 0 0;text-align:center;color:#8597a9;font-size:12px}.support .link{font-size:12px}.copyright{position:absolute;z-index:3;left:54px;bottom:28px;color:rgba(255,255,255,.64);font-size:12px;letter-spacing:.04em}.toast{position:fixed;z-index:10;left:50%;top:28px;transform:translate(-50%,-12px);padding:10px 16px;border-radius:8px;background:#17324d;color:#fff;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:960px){.hero-copy{display:none}.login-page:before{background:linear-gradient(90deg,rgba(8,35,66,.58),rgba(226,239,250,.45))}.login-shell{justify-content:center;padding:110px 24px 70px}.brand{left:28px;top:26px}.copyright{left:0;right:0;text-align:center}.login-card{width:min(420px,100%)}}
@media(max-height:720px){.login-shell{padding-top:24px;padding-bottom:24px}.login-card{padding-top:26px;padding-bottom:24px}.hero-copy h1{font-size:36px}.service-points{margin-top:18px}.copyright{display:none}}
</style>
</head>
<body>
<main class="login-page" id="loginPage">
  <div class="brand"><span class="brand-logo"><img id="brandLogoImage" class="is-default" src="./assets/visitor-pass-logo-official.png" alt="访客通 Logo"></span><div class="brand-copy"><b>访客通</b><span>VISITOR MANAGEMENT PLATFORM</span></div></div>
  <section class="hero-copy" aria-label="平台介绍"><div class="eyebrow">企业访客管理平台</div><h1>让每一次来访<br>都有序、安心、可追溯</h1><p>统一管理访客预约、审核与通行记录，为企业园区提供清晰可靠的访客服务。</p><div class="service-points"><span class="service-point"><i class="ri-shield-check-line"></i>身份核验</span><span class="service-point"><i class="ri-route-line"></i>全程留痕</span><span class="service-point"><i class="ri-building-2-line"></i>多场所管理</span></div></section>
  <div class="login-shell"><form class="login-card" onsubmit="login(event)"><h2>欢迎登录</h2><p class="hint">请输入企业管理账号信息</p><div class="field"><label for="account">账号</label><div class="input-wrap"><i class="ri-user-3-line"></i><input id="account" autocomplete="username" value="yx-admin" placeholder="请输入账号"></div></div><div class="field"><label for="password">密码</label><div class="input-wrap"><i class="ri-lock-2-line"></i><input id="password" type="password" autocomplete="current-password" value="12345678" placeholder="请输入密码"></div></div><div class="field"><label for="captchaInput">验证码</label><div class="captcha-row"><div class="input-wrap"><i class="ri-shield-keyhole-line"></i><input id="captchaInput" inputmode="numeric" maxlength="4" value="2768" placeholder="请输入验证码"></div><button class="captcha" type="button" onclick="refreshCaptcha()" aria-label="刷新验证码"><span id="captchaCode">2768</span></button></div></div><div class="options"><label class="remember"><input type="checkbox" checked>记住账号</label><button class="link" type="button" onclick="showToast('请联系企业超级管理员重置密码')">忘记密码</button></div><button class="submit" type="submit">登录访客管理平台</button></form></div>
  <div class="copyright">© 2026 远星智能制造有限公司 · 访客管理平台</div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const defaultBrandLogo='./assets/visitor-pass-logo-official.png';const brandDefaults={companyName:'远星智能制造有限公司',logo:''};let tenantBrand=brandDefaults;try{tenantBrand={...brandDefaults,...JSON.parse(localStorage.getItem('phase1_tenant_brand')||'{}')}}catch(error){tenantBrand=brandDefaults}
const displayName=tenantBrand.companyName?.trim()||brandDefaults.companyName;document.title=`${displayName.replace(/(股份|有限责任|有限)公司$/,'').slice(0,8)} · 访客管理平台`;document.querySelector('.copyright').textContent=`© 2026 ${displayName} · 访客管理平台`
function useDefaultBrandLogo(){brandLogoImage.src=defaultBrandLogo;brandLogoImage.classList.add('is-default');brandLogoImage.alt='访客通默认 Logo'}if(tenantBrand.logo?.trim()){brandLogoImage.classList.remove('is-default');brandLogoImage.src=tenantBrand.logo;brandLogoImage.alt=`${displayName} Logo`;brandLogoImage.onerror=()=>{brandLogoImage.onerror=null;useDefaultBrandLogo()}}else{useDefaultBrandLogo()}
let toastTimer;function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}function refreshCaptcha(){const code=String(Math.floor(1000+Math.random()*9000));captchaCode.textContent=code;captchaInput.value='';captchaInput.focus()}function login(event){event.preventDefault();if(!account.value.trim())return showToast('请输入账号');if(password.value.length<6)return showToast('请输入正确的密码');if(captchaInput.value!==captchaCode.textContent)return showToast('验证码不正确');showToast('登录成功，正在进入访客管理平台')}
</script>
</body>
</html>
