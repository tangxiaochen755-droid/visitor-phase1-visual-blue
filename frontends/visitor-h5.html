<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>访客端 · 华辰科技</title><link href="../assets/remixicon/remixicon.css" rel="stylesheet"><style>
:root{--ink:#202327;--muted:#737981;--line:#dfe2e5;--soft:#f4f5f6;--paper:#fff;--dark:#292d31;--warn:#8a6419;--warnbg:#faf4e7;--bad:#9a3f3f;--badbg:#faeeee;--ok:#3d6b55;--okbg:#edf5f0}*{box-sizing:border-box}body{margin:0;background:#e9ebed;color:var(--ink);font:14px "PingFang SC","Microsoft YaHei",sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--soft);position:relative;padding-bottom:76px}.top{height:132px;background:var(--dark);color:#fff;padding:22px 20px}.topbar{display:flex;align-items:center}.brand{font-weight:600;font-size:16px}.account{margin-left:auto;border:0;background:#3b4045;color:#fff;border-radius:18px;padding:7px 12px}.greet{margin-top:22px}.greet b{display:block;font-size:22px}.greet span{display:block;color:#c8ccd0;margin-top:5px;font-size:12px}.view{display:none;padding:16px}.view.active{display:block}.section-title{font-size:18px;font-weight:600;margin:2px 0 4px}.section-sub{font-size:12px;color:var(--muted);margin-bottom:15px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}.field{margin-bottom:15px;position:relative}.field:last-child{margin-bottom:0}.field label{display:block;font-size:13px;margin-bottom:7px;font-weight:500}.required:after{content:" *";color:#a43f3f}.input,.select,.textarea{width:100%;height:44px;border:1px solid #cfd3d7;border-radius:6px;background:#fff;padding:0 12px;color:var(--ink)}.textarea{height:76px;padding-top:10px;resize:none}.suggestions{display:none;position:absolute;left:0;right:0;top:70px;background:#fff;border:1px solid #cfd3d7;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:8;max-height:190px;overflow:auto}.suggestions.show{display:block}.suggestion{padding:11px 12px;border-bottom:1px solid #edf0f2;cursor:pointer}.suggestion:last-child{border:0}.suggestion b{display:block;font-size:13px}.suggestion span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.selected-person{display:none;margin-top:7px;padding:9px 11px;background:#f4f5f6;border-radius:5px;font-size:12px}.selected-person.show{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{height:42px;border:1px solid #cfd3d7;background:#fff;border-radius:6px}.seg button.active{background:#303439;color:#fff;border-color:#303439}.switchline{display:flex;align-items:center}.switchline button{margin-left:auto;width:46px;height:26px;border:0;border-radius:13px;background:#c5c9cd;position:relative}.switchline button:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switchline button.on{background:#3b4045}.switchline button.on:after{left:23px}.primary{width:100%;height:46px;border:0;border-radius:6px;background:#292d31;color:#fff;font-weight:600}.secondary{height:40px;border:1px solid #c8ccd0;border-radius:6px;background:#fff;padding:0 15px}.note{background:#f7f8f8;border-left:3px solid #7a8086;padding:10px 12px;color:#626970;font-size:12px;line-height:1.65;margin-bottom:12px}.filter{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.chip{white-space:nowrap;border:1px solid #d3d6d9;background:#fff;border-radius:16px;padding:6px 11px;color:#686e75}.chip.active{background:#303439;color:#fff;border-color:#303439}.record{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px}.record-head{display:flex;align-items:center}.record-head b{font-size:15px}.status{margin-left:auto;border-radius:11px;padding:3px 8px;font-size:11px;background:#eee;color:#656b72}.status.warn{background:var(--warnbg);color:var(--warn)}.status.ok{background:var(--okbg);color:var(--ok)}.status.bad{background:var(--badbg);color:var(--bad)}.meta{color:var(--muted);font-size:12px;line-height:1.8;margin-top:9px}.record-actions{display:flex;gap:8px;margin-top:10px}.link{border:0;background:none;color:#303439;padding:5px 0;font-weight:600}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);height:68px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;color:#8a8f95}.nav i{display:block;font-size:21px;margin-bottom:2px}.nav button.active{color:#202327;font-weight:600}.mask{position:fixed;inset:0;background:rgba(20,22,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}.mask.open{display:flex}.sheet{width:min(100%,430px);max-height:82vh;overflow:auto;background:#fff;border-radius:14px 14px 0 0;padding:19px}.sheet-head{display:flex;align-items:center;margin-bottom:16px;font-size:16px;font-weight:600}.close{margin-left:auto;border:0;background:none;font-size:22px}.detail{display:grid;grid-template-columns:88px 1fr;gap:11px 8px;font-size:13px}.detail label{color:var(--muted)}.qr{width:170px;height:170px;margin:16px auto;background:repeating-linear-gradient(45deg,#222 0 6px,#fff 6px 12px);border:10px solid #222;display:grid;place-items:center}.qr i{font-size:34px;background:#fff;padding:6px}.toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:#262a2e;color:#fff;padding:11px 18px;border-radius:6px;z-index:30;display:none}.toast.show{display:block}@media(min-width:700px){body{padding:24px}.app{min-height:calc(100vh - 48px);box-shadow:0 15px 50px rgba(0,0,0,.14);border-radius:18px;overflow:hidden}.nav{bottom:24px}}
</style></head><body><div class="app"><header class="top"><div class="topbar"><div class="brand">华辰访客服务</div><button class="account" onclick="openAccount()"><i class="ri-user-3-line"></i> 138****6201</button></div><div class="greet"><b>您好，张晨</b><span>身份编码 VIS-000001 · 手机号换绑后保持不变</span></div></header>
<main><section class="view active" id="apply"><div class="section-title">访问申请</div><div class="section-sub">请如实填写，带 * 项为必填</div><div class="note">通行范围和预约时间段由企业后台统一配置，审核通过后自动生效。</div><div class="card"><div class="field"><label class="required">访客姓名</label><input class="input" id="visitorName" value="张晨"></div><div class="field"><label>访客单位</label><input class="input" id="company" placeholder="请输入单位名称"></div><div class="field"><label class="required">手机号</label><input class="input" value="13800006201" disabled></div><div class="field"><label class="required">身份证号</label><input class="input" id="idcard" placeholder="请输入身份证号" maxlength="18"></div></div><div class="card"><div class="field"><label class="required">拜访形式</label><div class="seg"><button class="active" data-type="single" onclick="chooseVisitType(this)">单次拜访</button><button data-type="multiple" onclick="chooseVisitType(this)">多次拜访</button></div></div><div id="singleDate" class="row"><div class="field"><label class="required">预约日期</label><input class="input" type="date" value="2026-08-05"></div><div class="field"><label class="required">预约时间段</label><select class="select" id="visitTimeSlot"></select></div></div><div id="multiDate" class="row" style="display:none"><div class="field"><label class="required">开始日期</label><input class="input" type="date" value="2026-08-05"></div><div class="field"><label class="required">结束日期</label><input class="input" type="date" value="2026-08-12"></div></div><div class="field"><label class="required">被访人</label><input class="input" id="visiteeSearch" placeholder="输入姓名或手机号检索" autocomplete="off" oninput="searchVisitees(this.value)" onfocus="searchVisitees(this.value)"><div class="suggestions" id="visiteeSuggestions"></div><div class="selected-person" id="selectedVisitee"></div></div><div class="field"><label class="required">来访目的</label><select class="select"><option>商务洽谈</option><option>技术交流</option><option>面试</option><option>参观访问</option><option>送货</option><option>其他</option></select></div></div><div class="card"><div class="field switchline"><label>是否有车</label><button id="carSwitch" onclick="toggleCar()"></button></div><div class="field" id="plateField" style="display:none"><label class="required">车牌号</label><input class="input" placeholder="例如：沪A12345"></div><div class="field"><label>同行人</label><input class="input" placeholder="填写同行人姓名，多人用顿号分隔"></div><div class="field"><label>备注</label><textarea class="textarea" placeholder="请输入补充说明"></textarea></div></div><button class="primary" onclick="submitApply()">提交访问申请</button></section>
<section class="view" id="records"><div class="section-title">我的申请</div><div class="section-sub">查看审核状态、来访码和出访码</div><div class="filter" id="filters"><button class="chip active" onclick="filterRecords(this,'全部')">全部</button><button class="chip" onclick="filterRecords(this,'待审核')">待审核</button><button class="chip" onclick="filterRecords(this,'待来访')">待来访</button><button class="chip" onclick="filterRecords(this,'来访中')">来访中</button><button class="chip" onclick="filterRecords(this,'已结束')">已结束</button></div><div id="recordList"></div></section>
<section class="view" id="phone"><div class="section-title">修改手机号</div><div class="section-sub">验证原手机号后完成换绑，历史记录不会变化</div><div class="card"><div class="field"><label>原手机号</label><input class="input" value="13800006201" disabled></div><div class="field"><label class="required">验证码</label><div style="display:flex;gap:8px"><input class="input" id="smsCode" placeholder="请输入验证码" maxlength="6"><button class="secondary" onclick="toast('验证码已发送：123456')">获取验证码</button></div></div><div class="field"><label class="required">新手机号</label><input class="input" id="newPhone" placeholder="请输入新手机号" maxlength="11"></div></div><button class="primary" onclick="changePhone()">确认修改</button></section></main>
<nav class="nav"><button class="active" data-view="apply" onclick="switchView(this,'apply')"><i class="ri-file-add-line"></i>访问申请</button><button data-view="records" onclick="switchView(this,'records')"><i class="ri-file-list-3-line"></i>我的申请</button><button data-view="phone" onclick="switchView(this,'phone')"><i class="ri-smartphone-line"></i>修改手机号</button></nav></div>
<div class="mask" id="detailMask" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-head" id="sheetTitle">申请详情<button class="close" onclick="closeSheet()">×</button></div><div id="sheetBody"></div></div></div><div class="mask" id="accountMask" onclick="if(event.target===this)this.classList.remove('open')"><div class="sheet"><div class="sheet-head">账户信息<button class="close" onclick="accountMask.classList.remove('open')">×</button></div><div class="detail"><label>访客姓名</label><b>张晨</b><label>身份编码</label><span>VIS-000001</span><label>当前手机号</label><span>138****6201</span></div><button class="secondary" style="width:100%;margin-top:20px" onclick="toast('已退出演示账号')">退出登录</button></div></div><div class="toast" id="toast"></div>
<script>
let visitType='single',selectedVisiteeData=null;const visitees=[{name:'李敏',dept:'产品研发部',phone:'13800002071'},{name:'王磊',dept:'市场营销部',phone:'13900008743'},{name:'赵雪',dept:'行政管理部',phone:'18600004390'}];const defaultSlots=[{name:'早间',start:'08:30',end:'10:00',enabled:true},{name:'上午',start:'10:00',end:'12:00',enabled:true},{name:'午后',start:'13:30',end:'15:00',enabled:true},{name:'下午',start:'15:00',end:'17:30',enabled:true}];const records=[{id:'VS202608040021',date:'08-05 08:30-10:00',visitee:'李敏 · 产品研发部',purpose:'商务洽谈',status:'待审核'},{id:'VS202608030019',date:'08-04 13:30-15:00',visitee:'王磊 · 市场营销部',purpose:'技术交流',status:'待来访'},{id:'VS202608010011',date:'08-01 10:00-12:00',visitee:'李敏 · 产品研发部',purpose:'参观访问',status:'来访中'},{id:'VS202607300008',date:'07-30 15:00-17:30',visitee:'赵雪 · 行政管理部',purpose:'商务洽谈',status:'已结束'}];
function loadTimeSlots(){let slots=defaultSlots;try{const config=JSON.parse(localStorage.getItem('phase1_visit_settings'));if(config?.timeSlots?.length)slots=config.timeSlots}catch(e){}const enabled=slots.filter(s=>s.enabled!==false);visitTimeSlot.innerHTML=enabled.map(s=>`<option value="${s.start}-${s.end}">${s.start} - ${s.end}${s.name?'（'+s.name+'）':''}</option>`).join('')||'<option value="">暂无可预约时间段</option>'}function searchVisitees(value){const q=value.trim().toLowerCase();selectedVisiteeData=null;selectedVisitee.classList.remove('show');const rows=visitees.filter(v=>!q||(v.name+v.phone).toLowerCase().includes(q));visiteeSuggestions.innerHTML=rows.length?rows.map((v,i)=>`<div class="suggestion" onclick="chooseVisitee('${v.phone}')"><b>${v.name} · ${v.dept}</b><span>${v.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2')}</span></div>`).join(''):'<div class="suggestion"><span>未找到匹配的被访人</span></div>';visiteeSuggestions.classList.add('show')}function chooseVisitee(phone){selectedVisiteeData=visitees.find(v=>v.phone===phone);visiteeSearch.value=selectedVisiteeData.name;selectedVisitee.innerHTML=`已选择：<b>${selectedVisiteeData.name}</b> · ${selectedVisiteeData.dept} · ${selectedVisiteeData.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2')}`;selectedVisitee.classList.add('show');visiteeSuggestions.classList.remove('show')}document.addEventListener('click',e=>{if(!e.target.closest('#visiteeSearch')&&!e.target.closest('#visiteeSuggestions'))visiteeSuggestions.classList.remove('show')});function switchView(btn,id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(v=>v.classList.toggle('active',v===btn));if(id==='records')renderRecords('全部');scrollTo(0,0)}function chooseVisitType(btn){visitType=btn.dataset.type;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('active',x===btn));singleDate.style.display=visitType==='single'?'grid':'none';multiDate.style.display=visitType==='multiple'?'grid':'none'}function toggleCar(){carSwitch.classList.toggle('on');plateField.style.display=carSwitch.classList.contains('on')?'block':'none'}function submitApply(){if(!visitorName.value.trim())return toast('请填写访客姓名');if(!idcard.value.trim())return toast('请填写身份证号');if(!selectedVisiteeData)return toast('请通过姓名或手机号检索并选择被访人');if(visitType==='single'&&!visitTimeSlot.value)return toast('当前没有可预约时间段');records.unshift({id:'VS202608040022',date:visitType==='single'?`08-05 ${visitTimeSlot.value}`:'08-05 至 08-12',visitee:`${selectedVisiteeData.name} · ${selectedVisiteeData.dept}`,purpose:'商务洽谈',status:'待审核'});toast('申请提交成功');document.querySelector('.nav [data-view="records"]').click()}function cls(s){return s==='待审核'?'warn':s==='来访中'?'ok':s==='审核失败'||s==='已失效'?'bad':''}function renderRecords(filter){const rows=filter==='全部'?records:records.filter(x=>x.status===filter);recordList.innerHTML=rows.length?rows.map((r,i)=>`<article class="record"><div class="record-head"><b>${r.date}</b><span class="status ${cls(r.status)}">${r.status}</span></div><div class="meta">${r.visitee}<br>${r.purpose} · ${r.id}</div><div class="record-actions"><button class="link" onclick="openRecord('${r.id}')">查看详情</button>${['待来访','来访中'].includes(r.status)?`<button class="link" onclick="openCode('${r.id}')">出示${r.status==='待来访'?'来访':'出访'}码</button>`:''}</div></article>`).join(''):'<div class="card" style="text-align:center;color:#777">暂无该状态申请</div>'}function filterRecords(btn,s){document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===btn));renderRecords(s)}function openRecord(id){const r=records.find(x=>x.id===id);sheetTitle.childNodes[0].nodeValue='申请详情';sheetBody.innerHTML=`<div class="detail"><label>申请编号</label><b>${r.id}</b><label>预约时间</label><span>${r.date}</span><label>被访人</label><span>${r.visitee}</span><label>来访目的</label><span>${r.purpose}</span><label>访客单位</label><span>上海远航科技有限公司</span><label>状态</label><span class="status ${cls(r.status)}" style="margin:0;width:max-content">${r.status}</span></div>`;detailMask.classList.add('open')}function openCode(id){const r=records.find(x=>x.id===id);sheetTitle.childNodes[0].nodeValue=r.status==='待来访'?'来访二维码':'出访二维码';sheetBody.innerHTML=`<div class="qr"><i class="ri-qr-code-line"></i></div><p style="text-align:center">${id}</p><div class="note">请在扫码设备前出示二维码。二维码有效性以当前申请状态为准。</div>`;detailMask.classList.add('open')}function closeSheet(){detailMask.classList.remove('open')}function openAccount(){accountMask.classList.add('open')}function changePhone(){if(smsCode.value!=='123456')return toast('验证码错误');if(!/^1\d{10}$/.test(newPhone.value))return toast('请输入正确的新手机号');toast('手机号修改成功，身份编码保持不变')}let timer;function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),1800)}loadTimeSlots();renderRecords('全部');
</script></body></html>
