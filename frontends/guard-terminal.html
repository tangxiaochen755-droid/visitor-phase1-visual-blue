<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>扫码设备端</title>
<link href="../assets/remixicon/remixicon.css" rel="stylesheet">
<style>
:root{--ink:#202327;--muted:#737981;--line:#d9dde1;--soft:#f3f4f6;--dark:#292d31;--ok:#3d6b55;--bad:#913e46}*{box-sizing:border-box}body{margin:0;background:#e8eaec;color:var(--ink);font:14px "PingFang SC","Microsoft YaHei",sans-serif}.device{min-height:100vh;background:var(--soft)}header{height:64px;background:var(--dark);color:#fff;display:flex;align-items:center;padding:0 20px;gap:20px}.brand{font-size:17px;font-weight:600}.meta{color:#c7cbd0}.online{margin-left:auto;color:#bde1ca}.shell{padding:20px}.head{margin-bottom:16px}.head h1{font-size:22px;margin:0 0 5px}.head span{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(420px,1.2fr) minmax(340px,.8fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px}.camera{height:430px;background:#202327;color:#fff;display:grid;place-items:center;text-align:center;border-radius:7px}.frame{width:230px;height:230px;border:3px solid #fff;position:relative;margin:auto}.scanline{height:2px;background:#fff;position:absolute;left:10px;right:10px;top:50%;animation:scan 2s infinite}@keyframes scan{0%,100%{top:12px}50%{top:210px}}.camera p{color:#bbc0c5}.manual{display:flex;gap:8px;margin-top:12px}.input{height:42px;border:1px solid #cbd0d4;border-radius:5px;padding:0 12px;flex:1}.btn{height:42px;border:1px solid #c7ccd1;background:#fff;border-radius:5px;padding:0 16px;cursor:pointer}.btn.primary{background:#303439;color:#fff;border-color:#303439}.placeholder{min-height:450px;display:grid;place-items:center;text-align:center;color:#8b9096}.placeholder i{font-size:64px}.result{display:none}.result.show{display:block}.result-status{padding:16px;border:1px solid #bbcec2;background:#f0f6f2;color:var(--ok);text-align:center}.result-status.bad{border-color:#d8b9bc;background:#faf0f1;color:var(--bad)}.result-status i{font-size:42px;display:block}.result-status b{font-size:18px}.detail{display:grid;grid-template-columns:92px 1fr;gap:12px;margin:20px 0}.detail label{color:var(--muted)}.note{padding:12px;background:#f7f8f9;border-left:3px solid #777;color:#626970;font-size:12px;line-height:1.7}.mask{position:fixed;inset:0;background:rgba(20,22,24,.45);display:none;place-items:center;padding:16px}.mask.open{display:grid}.dialog{width:min(480px,100%);background:#fff;border-radius:8px;padding:20px}.dialog h2{margin:0 0 20px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#222;color:#fff;padding:11px 18px;border-radius:5px;display:none}.toast.show{display:block}@media(max-width:850px){header{height:auto;min-height:64px;padding:12px 16px;gap:8px 12px;flex-wrap:wrap}.meta{order:3;width:100%;font-size:11px}.shell{padding:16px}.layout{grid-template-columns:1fr;gap:12px}.panel{padding:16px}.camera{height:min(52vh,330px)}.manual{display:grid;grid-template-columns:1fr 1fr}.manual .input{grid-column:1/-1;width:100%}.placeholder{min-height:330px}}
</style><style>:root{--ink:#17324d;--muted:#698198;--line:#d2e3f1;--soft:#f3f8fd;--dark:#126bd2;--ok:#247a52;--bad:#b4232c}body{background:#eaf2f9}header{background:linear-gradient(135deg,#1677ff,#5aa7ff)}.panel{border-color:#d2e3f1}.camera{background:#102b45}.frame{border-color:#7ec0ff}.scanline{background:#52a8ff;box-shadow:0 0 10px #52a8ff}.btn.primary{background:#1677ff;border-color:#1677ff}.note{background:#edf6ff;border-left-color:#5aa7ff;color:#456783}.input:focus{outline:2px solid rgba(22,119,255,.15);border-color:#1677ff}.toast{background:#145ca8}</style>
</head>
<body>
<div class="device">
  <header><div class="brand"><i class="ri-qr-scan-2-line"></i> 华辰访客核验</div><div class="meta">总部园区 · 北门 · BG-N-01</div><div class="online"><i class="ri-checkbox-blank-circle-fill"></i> 设备在线</div></header>
  <main class="shell">
    <div class="head"><h1>扫码确认</h1><span>设备端无人员账号，仅通过唯一设备编码绑定；支持来访码与出访码核验</span></div>
    <div class="layout">
      <section class="panel"><div class="camera"><div><div class="frame"><div class="scanline"></div></div><p>将访客二维码置于框内，系统将自动识别</p></div></div><div class="manual"><input class="input" id="manualCode" placeholder="摄像头不可用时，可手工输入二维码内容"><button class="btn" onclick="runScan('manual')">确认输入</button><button class="btn primary" onclick="runScan('visit')">模拟扫码</button></div></section>
      <section class="panel"><div class="placeholder" id="placeholder"><div><i class="ri-qr-scan-2-line"></i><h2>等待扫码</h2><p>扫码结果将在此处显示</p></div></div><div class="result" id="result"><div class="result-status" id="resultStatus"><i class="ri-checkbox-circle-line"></i><b id="resultTitle">来访确认成功</b></div><div class="detail"><label>申请编号</label><b>VS202607310018</b><label>访客</label><span>张晨 · VIS-000001</span><label>被访人</label><span>李敏 · 产品研发部</span><label>拜访形式</label><span>单次拜访</span><label>通行点</label><span>总部园区 · 北门</span><label>通行设备</label><span>BG-N-01</span><label>核验时间</label><span id="scanTime">2026-08-05 09:26</span></div><div class="note">核验成功后，后台立即新增一条独立通行事件，并记录本设备编码。设备禁用、离线、二维码过期、二维码已使用或通行点不匹配时核验失败。</div><button class="btn primary" style="width:100%;margin-top:16px" onclick="continueScan()">继续扫码</button></div></section>
    </div>
  </main>
</div>
<div class="mask" id="bindMask"><div class="dialog"><h2>设备绑定</h2><div class="detail"><label>设备编码</label><b>BG-N-01</b><label>设备名称</label><span>北门扫码设备 01</span><label>所属场所</label><span>总部园区</span><label>通行点</label><span>北门</span><label>设备启用</label><span>启用</span><label>设备状态</label><span>在线</span></div><div class="dialog-actions"><button class="btn primary" onclick="bindMask.classList.remove('open')">确认</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
function runScan(type){if(type==='manual'&&!manualCode.value.trim())return toast('请输入二维码内容');placeholder.style.display='none';result.classList.add('show');scanTime.textContent=new Date().toLocaleString('zh-CN',{hour12:false});toast('核验成功，通行事件已写入后台')}
function continueScan(){result.classList.remove('show');placeholder.style.display='grid';manualCode.value=''}
let timer;function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),1800)}
if(!localStorage.getItem('phase1_device_bound')){bindMask.classList.add('open');localStorage.setItem('phase1_device_bound','BG-N-01')}
</script>
</body>
</html>
