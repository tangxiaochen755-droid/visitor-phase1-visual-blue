function approveApplication(id){const r=findApplication(id);r.status=r.type==='多次拜访'?'生效中':'待来访';closeSheet();render('applications');showToast('审核通过，已短信通知访客')}function rejectApplication(id){if(!rejectReason.value.trim())return showToast('请填写拒绝原因');const r=findApplication(id);r.status='审核失败';closeSheet();render('applications');showToast('已拒绝并短信通知访客')}
function cancelInvite(id){const r=findApplication(id);r.status='已撤销';render('applications');showToast('代申请已撤销，未发生的通行权限同步失效')}function terminate(id){const r=findApplication(id);r.status='已终止';render('applications');showToast('剩余授权已终止，历史访问记录保留')}
function showCode(id,status){openSheet(status==='来访中'?'出访二维码':'来访二维码',`<div class="qr"><svg class="ui-icon"><use href="#i-qr"/></svg></div><p style="text-align:center">${id}</p><div class="note">二维码仅在当前企业授权通行点和有效期内使用。</div>`)}
function accessApplication(r){return (role==='visitor'?visitorApplications:hostApplications).find(a=>a.id===r.applicationId)||visitorApplications.concat(hostApplications).find(a=>a.id===r.applicationId)}
function accessView(){const source=accessData[role],q=accessQuery.trim().toLowerCase(),filters=['全部','进入','离开'],rows=source.map((r,i)=>({r,i,a:accessApplication(r)})).filter(x=>(activeAccessFilter==='全部'||x.r.direction===activeAccessFilter)&&inDateRange(x.r.date,accessDateFrom,accessDateTo)&&(!q||Object.values(x.r).concat(Object.values(x.a||{})).join(' ').toLowerCase().includes(q)));return `<section class="view active"><div class="section-head"><div><h2>访问记录</h2><p>每次进入或离开单独形成一条记录，与后台“访问记录”逐条对应</p></div><span class="count">${rows.length} 条</span></div><div class="search"><svg class="ui-icon"><use href="#i-search"/></svg><input aria-label="搜索访问记录" value="${accessQuery}" oninput="setAccessQuery(this.value)" placeholder="访客 / 被访人 / 申请编号"></div>${dateFilterHtml('access',accessDateFrom,accessDateTo)}<div class="chips">${filters.map(f=>`<button class="chip ${f===activeAccessFilter?'active':''}" onclick="setAccessFilter('${f}')">${f}</button>`).join('')}</div>${rows.length?rows.map(x=>`<article class="record"><div class="record-head"><b>${x.a?.visitor||'访客'} · ${x.a?.host||'被访人'}</b><span class="direction-tag ${x.r.direction==='进入'?'in':'out'}">${x.r.direction}</span></div><div class="meta">${x.r.time}<br>${x.a?.point||'通行点'}<br>记录编号 ${x.r.id} · 申请 ${x.r.applicationId}</div><div class="record-actions"><button class="inline-action" onclick="viewAccess(${x.i})">查看详情</button></div></article>`).join(''):'<div class="empty">暂无符合条件的访问记录<br><button class="inline-action" onclick="clearAccessFilters()">清空筛选</button></div>'}</section>`}
function setAccessFilter(filter){activeAccessFilter=filter;render('access')}function setAccessQuery(value){accessQuery=value;render('access');const input=document.querySelector('.search input');input?.focus();input?.setSelectionRange(value.length,value.length)}function clearAccessFilters(){activeAccessFilter='全部';accessQuery='';accessDateFrom='';accessDateTo='';render('access')}
function viewAccess(index){const r=accessData[role][index],a=accessApplication(r);openSheet('访问记录详情',`<div class="detail"><div><label>记录编号</label><b>${r.id}</b></div><div><label>进出方向</label><span><span class="direction-tag ${r.direction==='进入'?'in':'out'}">${r.direction}</span></span></div><div><label>通行时间</label><span>${r.time}</span></div><div><label>通行设备</label><span>${r.device}</span></div><div><label>申请编号</label><span>${r.applicationId}</span></div></div><div class="note" style="margin-top:12px">以下为本次访问对应的完整申请信息</div>${a?detailHtml(a):'<div class="empty">未找到对应申请记录</div>'}`)}
function profileRow(icon,label,value='',action=''){return `<button class="profile-row" ${action?`onclick="showToast('${action}')"`:''}><span class="profile-row-icon"><svg class="ui-icon"><use href="#${icon}"/></svg></span><span class="profile-row-label">${label}</span><span class="profile-row-value">${value}</span><svg class="ui-icon"><use href="#i-next"/></svg></button>`}
function profileView(){const visitor=role==='visitor',name=visitor?'张晨':'李敏',subtitle=visitor?'访客身份 · VIS-000001':'产品研发部 · EMP-000001',badge=visitor?'访客':'被访人';return `<section class="view active profile-page"><div class="profile-hero"><div class="profile-tools"><button class="profile-tool" aria-label="设置" onclick="showToast('已打开设置')"><svg class="ui-icon"><use href="#i-settings"/></svg></button><button class="profile-tool" aria-label="通知" onclick="showToast('暂无新通知')"><svg class="ui-icon"><use href="#i-bell"/></svg></button></div><div class="profile-identity"><img class="profile-avatar" src="../assets/default-avatar.webp" alt="默认头像，可替换"><div class="profile-copy"><b>${name}</b><p>${subtitle}</p><span class="identity-badge"><svg class="ui-icon"><use href="#i-user"/></svg>${badge}</span></div></div></div><div class="profile-content"><section class="profile-group"><h3 class="profile-group-title">账号信息</h3>${profileRow('i-building','所属企业',visitor?'华辰科技有限公司':'华辰科技有限公司','已打开企业信息')}${visitor?profileRow('i-team','访客单位','上海远航科技','已打开访客单位'):profileRow('i-team','所属部门','产品研发部','已打开部门信息')}${profileRow('i-phone','手机号',visitor?'138****6201':'138****2071','已打开修改手机号')}</section><section class="profile-group"><h3 class="profile-group-title">访客服务</h3>${profileRow('i-map','拜访通行点',visitor?'按申请授权':'北门、研发园区东门','已打开通行点说明')}${profileRow('i-shield','访问权限说明','','已打开访问权限说明')}</section><section class="profile-group"><h3 class="profile-group-title">账号与安全</h3>${profileRow('i-phone','修改手机号','','已打开修改手机号')}${profileRow('i-lock','修改密码','','已打开修改密码')}${profileRow('i-shield','隐私政策与用户协议','','已打开隐私政策')}</section><button class="profile-logout" onclick="showToast('已退出当前企业访客通')">退出登录</button><p class="profile-tenant">当前企业：华辰科技有限公司</p></div></section>`}
let loginCodeTimer=0;
function sendLoginCode(){const phone=loginPhone.value.trim();if(!/^1\d{10}$/.test(phone))return focusError('loginPhone','请输入正确的手机号');if(loginCodeTimer)return;let seconds=60;codeButton.disabled=true;codeButton.textContent=`${seconds}s 后重试`;loginCodeTimer=setInterval(()=>{seconds--;codeButton.textContent=seconds?`${seconds}s 后重试`:'获取验证码';if(!seconds){clearInterval(loginCodeTimer);loginCodeTimer=0;codeButton.disabled=false}},1000);showToast('验证码已发送，演示验证码为 123456')}
function login(event){event.preventDefault();const phone=loginPhone.value.trim(),code=loginCode.value.trim();if(!/^1\d{10}$/.test(phone))return focusError('loginPhone','请输入正确的手机号');if(!/^\d{6}$/.test(code))return focusError('loginCode','请输入 6 位验证码');if(!loginAgreement.checked)return showToast('请先阅读并同意用户协议和隐私政策');loginScreen.hidden=true;document.body.classList.remove('login-mode');scrollTo(0,0);showToast('登录成功')}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&mask.classList.contains('open'))closeSheet()});if(window.visualViewport){const baseHeight=window.visualViewport.height;window.visualViewport.addEventListener('resize',()=>document.body.classList.toggle('keyboard-open',window.visualViewport.height<baseHeight*.75))}
render('apply');
</script></body></html>
