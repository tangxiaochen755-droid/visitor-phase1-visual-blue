const loginPanel=document.querySelector('.login-panel');
function loginForm(){return `<div class="login-tabs" role="tablist" aria-label="登录方式"><button class="login-tab active" id="passwordTab" type="button" onclick="switchLoginMode('password')">密码登录</button><button class="login-tab" id="smsTab" type="button" onclick="switchLoginMode('sms')">验证码登录</button></div><div class="login-field"><label for="loginPhone">手机号</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-phone"/></svg><input id="loginPhone" inputmode="tel" autocomplete="tel" maxlength="11" placeholder="请输入手机号"></div></div><div class="login-field" id="passwordLoginField"><label for="loginPassword">密码</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-lock"/></svg><input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入登录密码"></div></div><div class="login-field" id="smsLoginField" hidden><label for="loginCode">验证码</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-shield"/></svg><input id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入验证码"><button class="code-button" id="codeButton" type="button" onclick="sendLoginCode()">获取验证码</button></div></div><button class="primary login-button" type="submit">登录</button>`}
function registerForm(){const visitor=registrationRole==='visitor',roleTabs=employeeRegistrationOpen?`<span class="register-role-label">注册身份</span><div class="register-role-tabs" role="tablist" aria-label="注册身份"><button class="register-role-tab ${visitor?'active':''}" type="button" role="tab" aria-selected="${visitor}" onclick="switchRegistrationRole('visitor')">访客</button><button class="register-role-tab ${visitor?'':'active'}" type="button" role="tab" aria-selected="${!visitor}" onclick="switchRegistrationRole('employee')">员工</button></div>`:'';return `${roleTabs}<div class="register-note">${visitor?'注册后将自动关联该手机号下由被访人代办的申请记录。':'提交员工资料，审核通过后可作为被访人使用。'}</div><div class="login-field"><label class="required" for="registerName">${visitor?'姓名':'员工姓名'}</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-user"/></svg><input id="registerName" autocomplete="name" maxlength="20" placeholder="请输入真实姓名"></div></div>${visitor?'<div class="login-field"><label for="registerCompany">单位名称（选填）</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-building"/></svg><input id="registerCompany" maxlength="50" placeholder="请输入单位名称"></div></div>':'<div class="login-field"><label class="required" for="registerDepartment">所属部门</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-team"/></svg><input id="registerDepartment" maxlength="50" placeholder="请填写您所在的部门名称"></div></div>'}<div class="login-field"><label class="required" for="loginPhone">手机号</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-phone"/></svg><input id="loginPhone" inputmode="tel" autocomplete="tel" maxlength="11" placeholder="请输入手机号"></div></div><div class="login-field"><label class="required" for="loginCode">验证码</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-shield"/></svg><input id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="请输入验证码"><button class="code-button" id="codeButton" type="button" onclick="sendLoginCode()">获取验证码</button></div></div><div class="login-field"><label class="required" for="registerPassword">设置密码</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-lock"/></svg><input id="registerPassword" type="password" autocomplete="new-password" placeholder="请输入不少于 8 位的密码"></div></div><div class="login-field"><label class="required" for="registerPasswordConfirm">确认密码</label><div class="login-input-wrap"><svg class="ui-icon"><use href="#i-lock"/></svg><input id="registerPasswordConfirm" type="password" autocomplete="new-password" placeholder="请再次输入密码"></div></div><button class="primary login-button" type="submit">${visitor?'注册并进入':'提交注册申请'}</button>`}
function renderAuth(){const registering=authMode==='register',visitorRegistration=registrationRole==='visitor';loginPanel.innerHTML=registering?registerForm():loginForm();loginAgreement.closest('label').hidden=false;loginScreen.classList.toggle('register-mode',registering);loginTitle.innerHTML=registering?'账号注册':'您好，<span>欢迎使用访客通</span>';document.querySelector('.login-intro p').textContent=registering?(visitorRegistration?(employeeRegistrationOpen?'选择注册身份并填写账号资料':'填写访客账号资料'):'提交员工资料，审核通过后可作为被访人使用'):'';document.querySelector('.login-support').innerHTML=registering?`已有账号？<button type="button" onclick="switchAuthMode('login')">返回登录</button>`:`还没有账号？<button type="button" onclick="switchAuthMode('register')">注册账号</button>`}
function switchAuthMode(mode){authMode=mode;loginMode='password';registrationRole=employeeRegistrationOpen?role:'visitor';renderAuth();scrollTo(0,0);setTimeout(()=>document.querySelector(authMode==='register'?'#registerName':'#loginPhone')?.focus(),0)}
function switchRegistrationRole(nextRole){if(nextRole==='employee'&&!employeeRegistrationOpen)return showToast('当前企业暂未开放员工注册');registrationRole=nextRole;renderAuth();scrollTo(0,0)}
renderAuth();
function switchLoginMode(mode){loginMode=mode;passwordTab.classList.toggle('active',mode==='password');smsTab.classList.toggle('active',mode==='sms');passwordLoginField.hidden=mode!=='password';smsLoginField.hidden=mode!=='sms';(mode==='password'?loginPassword:loginCode).focus()}
function sendLoginCode(){const phone=loginPhone.value.trim();if(!/^1\d{10}$/.test(phone))return focusError('loginPhone','请输入正确的手机号');if(loginCodeTimer)return;let seconds=60;codeButton.disabled=true;codeButton.textContent=`${seconds}s 后重试`;loginCodeTimer=setInterval(()=>{seconds--;codeButton.textContent=seconds?`${seconds}s 后重试`:'获取验证码';if(!seconds){clearInterval(loginCodeTimer);loginCodeTimer=0;codeButton.disabled=false}},1000);showToast('验证码已发送，演示验证码为 123456')}
function login(event){event.preventDefault();if(authMode==='register')return registerAccount();const phone=loginPhone.value.trim();if(!/^1\d{10}$/.test(phone))return focusError('loginPhone','请输入正确的手机号');if(loginMode==='password'&&loginPassword.value.length<6)return focusError('loginPassword','请输入正确的登录密码');if(loginMode==='sms'&&!/^\d{6}$/.test(loginCode.value.trim()))return focusError('loginCode','请输入 6 位验证码');if(!loginAgreement.checked)return showToast('请先阅读并同意用户协议和隐私政策');if(role==='host'&&employeeLoginStatus==='pending')return showRegistrationPending();if(role==='host'&&employeeLoginStatus==='rejected')return showRegistrationRejected();enterApp(`${loginMode==='password'?'密码':'验证码'}登录成功`)}
function registerAccount(){const name=registerName.value.trim(),phone=loginPhone.value.trim(),code=loginCode.value.trim(),password=registerPassword.value,confirm=registerPasswordConfirm.value;if(!name)return focusError('registerName','请输入真实姓名');if(registrationRole==='employee'&&!registerDepartment.value.trim())return focusError('registerDepartment','请输入所属部门');if(!/^1\d{10}$/.test(phone))return focusError('loginPhone','请输入正确的手机号');if(!/^\d{6}$/.test(code))return focusError('loginCode','请输入 6 位验证码');if(password.length<8)return focusError('registerPassword','密码至少 8 位');if(password!==confirm)return focusError('registerPasswordConfirm','两次输入的密码不一致');if(!loginAgreement.checked)return showToast('请先阅读并同意用户协议和隐私政策');if(registrationRole==='employee')return showRegistrationPending();role='visitor';activeApplicationFilter='全部';render('apply');enterApp('注册成功，历史代申请已自动关联')}
function showRegistrationPending(){loginTitle.textContent='注册申请已提交';document.querySelector('.login-intro p').textContent='企业管理员审核后会通过短信通知您';loginPanel.innerHTML=`<div class="registration-result"><div class="registration-result-icon"><svg class="ui-icon"><use href="#i-shield"/></svg></div><h2>等待企业审核</h2><p>当前账号暂不能使用被访人功能。审核通过后，可使用注册手机号和密码登录。</p><button class="primary" type="button" onclick="switchAuthMode('login')">返回登录</button></div>`;loginAgreement.closest('label').hidden=true;document.querySelector('.login-support').innerHTML='如长时间未处理，请联系当前企业管理员。';scrollTo(0,0)}
function showRegistrationRejected(){loginTitle.textContent='注册审核未通过';document.querySelector('.login-intro p').textContent=employeeRegistrationOpen?'请根据审核意见修改资料后重新提交':'当前企业已暂停员工注册';loginPanel.innerHTML=`<div class="registration-result"><div class="registration-result-icon"><svg class="ui-icon"><use href="#i-close"/></svg></div><h2>员工注册审核未通过</h2><p>审核意见：所属部门信息无法确认，请填写完整部门名称后重新提交。</p>${employeeRegistrationOpen?'<button class="primary" type="button" onclick="resubmitEmployeeRegistration()">修改资料并重新提交</button>':'<div class="register-note">当前企业已暂停员工注册，请联系企业管理员处理。</div>'}<button class="auth-switch" type="button" onclick="switchAuthMode('login')">返回登录</button></div>`;loginAgreement.closest('label').hidden=true;document.querySelector('.login-support').innerHTML='如有疑问，请联系当前企业管理员。';scrollTo(0,0)}
function resubmitEmployeeRegistration(){registrationRole='employee';authMode='register';renderAuth();scrollTo(0,0);setTimeout(()=>document.querySelector('#registerName')?.focus(),0)}
function enterApp(message){loginScreen.hidden=true;document.body.classList.remove('login-mode');scrollTo(0,0);showToast(message)}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&mask.classList.contains('open'))closeSheet()});if(window.visualViewport){const baseHeight=window.visualViewport.height;window.visualViewport.addEventListener('resize',()=>document.body.classList.toggle('keyboard-open',window.visualViewport.height<baseHeight*.75))}
render('apply');
</script></body></html>
