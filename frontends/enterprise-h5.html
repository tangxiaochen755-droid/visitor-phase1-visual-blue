function applyView(){return `<section class="view active apply-page"><div class="section-head"><div><h2>${role==='visitor'?'申请访问':'代访客申请'}</h2><p>${role==='visitor'?'为本人提交来访申请':'填写访客手机号后直接生成访问申请'}</p></div></div>${role==='host'?'<div class="note"><b>账号绑定规则：</b>系统按手机号匹配本企业访客账号并绑定账号 ID；若手机号尚未注册，申请仍直接生效并标记“待账号绑定”，访客以后使用该手机号注册时自动补绑，无需访客确认。</div>':''}<div class="card"><div class="card-title">${role==='visitor'?'访客信息':'代申请访客'}</div><div class="field"><label class="required" for="visitorName">访客姓名</label><input class="input" id="visitorName" value="${role==='visitor'?'张晨':''}" placeholder="请输入访客姓名"></div><div class="field"><label class="required" for="visitorPhone">手机号</label><input class="input" id="visitorPhone" inputmode="tel" value="${role==='visitor'?'13800006201':''}" ${role==='visitor'?'disabled':''} placeholder="用于匹配或等待绑定访客账号"></div><div class="field"><label for="visitorCompany">访客单位</label><input class="input" id="visitorCompany" placeholder="请输入单位名称"></div>${role==='visitor'?'<div class="field"><label class="required" for="idCard">身份证号</label><input class="input" id="idCard" maxlength="18" placeholder="用于现场身份核验"></div>':'<div class="helper">代申请不要求访客确认；未注册访客的账号资料在其注册后完善。</div>'}</div><div class="card"><div class="card-title">拜访安排<small>通行范围由企业确定</small></div><div class="field"><label class="required">拜访形式</label><div class="seg"><button class="active" onclick="chooseType(this,'single')">单次拜访</button><button onclick="chooseType(this,'multiple')">多次拜访</button></div></div><div id="dateFields">${dateFields()}</div>${role==='visitor'?'<div class="field"><label class="required" for="hostName">被访人</label><input class="input" id="hostName" value="李敏 · 产品研发部" placeholder="输入姓名或手机号检索"></div>':'<div class="field"><label for="fixedHost">被访人</label><input class="input" id="fixedHost" value="李敏 · 产品研发部" disabled><div class="helper">固定为当前员工，不允许代其他员工发起。</div></div>'}<div class="field"><label class="required" for="purpose">来访目的</label><select class="select" id="purpose"><option>商务洽谈</option><option>项目交流</option><option>面试</option><option>参观访问</option><option>送货</option><option>其他</option></select></div></div><div class="card"><div class="card-title">同行与车辆<small>支持多人与多车</small></div><div class="field"><label for="companionCount">同行人数（不含本人）</label><input class="input" id="companionCount" type="number" min="0" max="20" value="0" inputmode="numeric" oninput="updateVehicleWarning()"><div class="helper">主访客不计入同行人数；例如本人带 2 人来访，请填写 2。</div></div><div class="field"><label>同行车辆</label><div id="vehicleList"></div><button class="add-line" onclick="addVehicle()"><svg class="ui-icon"><use href="#i-add"/></svg> 添加同行车辆</button><div class="helper">可添加多辆车；每辆车单独填写车牌号，可随时删除。</div><div class="field-warning" id="vehicleWarning">车辆数已超过到访总人数，请确认同行人数或车辆信息是否正确。</div></div><div class="field"><label for="visitRemark">备注</label><textarea class="textarea" id="visitRemark" placeholder="请输入其他补充说明"></textarea></div></div><div class="submit-bar"><button class="primary" onclick="submitApplication()">${role==='visitor'?'提交访问申请':'提交代申请'}</button></div></section>`}
function dateFields(){return visitType==='single'?`<div class="row"><div class="field"><label class="required" for="visitDate">预约日期</label><input class="input" id="visitDate" type="date" value="2026-08-08"></div><div class="field"><label class="required" for="visitSlot">预约时段</label><select class="select" id="visitSlot"><option>08:30-10:00</option><option selected>10:00-12:00</option><option>13:30-15:00</option><option>15:00-17:30</option></select></div></div>`:`<div class="row"><div class="field"><label class="required" for="startDate">开始日期</label><input class="input" id="startDate" type="date" value="2026-08-08"></div><div class="field"><label class="required" for="endDate">结束日期</label><input class="input" id="endDate" type="date" value="2026-08-30"></div></div>`}
function chooseType(btn,type){visitType=type;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('active',x===btn));document.querySelector('#dateFields').innerHTML=dateFields()}
let vehicles=[];function renderVehicles(){const box=document.querySelector('#vehicleList');if(!box)return;box.innerHTML=vehicles.length?vehicles.map((v,i)=>`<div class="vehicle-row"><span class="vehicle-index">${i+1}</span><input class="input" aria-label="同行车辆 ${i+1} 车牌号" value="${v.plate}" oninput="updateVehicle(${v.id},this.value)" placeholder="例如：沪A12345" maxlength="10"><button class="danger" onclick="removeVehicle(${v.id})" aria-label="删除同行车辆 ${i+1}"><svg class="ui-icon"><use href="#i-trash"/></svg></button></div>`).join(''):'<div class="helper">暂未添加同行车辆</div>';updateVehicleWarning()}
function addVehicle(){vehicles.push({id:vehicleSeq++,plate:''});renderVehicles();document.querySelector('#vehicleList .vehicle-row:last-child input')?.focus()}function updateVehicle(id,plate){vehicles.find(v=>v.id===id).plate=plate}function removeVehicle(id){vehicles=vehicles.filter(v=>v.id!==id);renderVehicles()}function updateVehicleWarning(){const warning=document.querySelector('#vehicleWarning'),count=Number(document.querySelector('#companionCount')?.value||0);warning?.classList.toggle('show',vehicles.length>count+1)}
function focusError(id,message){showToast(message);document.querySelector('#'+id)?.focus()}
function submitApplication(){const name=document.querySelector('#visitorName').value.trim(),phone=document.querySelector('#visitorPhone').value.trim(),count=Number(document.querySelector('#companionCount').value),plates=vehicles.map(v=>v.plate.trim().toUpperCase());if(!name)return focusError('visitorName','请填写访客姓名');if(!/^1\d{10}$/.test(phone))return focusError('visitorPhone','请填写正确的访客手机号');if(role==='visitor'&&!document.querySelector('#idCard').value.trim())return focusError('idCard','请填写身份证号');if(!Number.isInteger(count)||count<0||count>20)return focusError('companionCount','同行人数须为 0 至 20 的整数');if(plates.some(v=>!v))return showToast('请完整填写已添加车辆的车牌号');if(new Set(plates).size!==plates.length)return showToast('同行车辆中存在重复车牌，请检查');showToast(role==='visitor'?'申请已提交，等待被访人审核':'代申请已生效，系统正在匹配访客账号');setTimeout(()=>document.querySelector('.nav [data-view="applications"]').click(),700)}
function applicationView(){const rows=role==='visitor'?visitorApplications:hostApplications;const filters=role==='visitor'?['全部','待审核','待来访','已结束']:['全部','待我处理','我发起的','待来访','生效中'];const q=applicationQuery.trim().toLowerCase(),visible=rows.filter(r=>(activeApplicationFilter==='全部'||(activeApplicationFilter==='待我处理'&&r.status==='待审核')||(activeApplicationFilter==='我发起的'&&r.source==='被访人代申请')||r.status===activeApplicationFilter)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)));return `<section class="view active"><div class="section-head"><div><h2>申请记录</h2><p>${role==='visitor'?'我的自主申请及已绑定到当前账号的代申请':'待我审核及本人代发起的申请'}</p></div><span class="count">${visible.length} 条</span></div><div class="search"><svg class="ui-icon"><use href="#i-search"/></svg><input aria-label="搜索申请记录" value="${applicationQuery}" oninput="setApplicationQuery(this.value)" placeholder="访客 / 被访人 / 申请编号"></div><div class="chips">${filters.map(f=>`<button class="chip ${f===activeApplicationFilter?'active':''}" onclick="setApplicationFilter('${f}')">${f}</button>`).join('')}</div><div>${visible.length?visible.map(applicationCard).join(''):'<div class="empty">暂无符合条件的申请<br><button class="inline-action" onclick="clearApplicationFilters()">清空筛选</button></div>'}</div></section>`}
function setApplicationFilter(filter){activeApplicationFilter=filter;render('applications')}
function setApplicationQuery(value){applicationQuery=value;render('applications');const input=document.querySelector('.search input');input?.focus();input?.setSelectionRange(value.length,value.length)}function clearApplicationFilters(){activeApplicationFilter='全部';applicationQuery='';render('applications')}
function applicationCard(r){const actions=role==='host'&&r.status==='待审核'?`<button class="inline-action" onclick="review('${r.id}')">处理申请</button>`:role==='host'&&r.source==='被访人代申请'&&['待来访','生效中'].includes(r.status)?`<button class="inline-action" onclick="cancelInvite('${r.id}')">撤销</button>${r.status==='生效中'?`<button class="inline-action" onclick="terminate('${r.id}')">终止授权</button>`:''}`:['待来访','来访中','生效中'].includes(r.status)?`<button class="inline-action" onclick="showCode('${r.id}','${r.status}')">查看通行码</button>`:'';const source=r.source==='被访人代申请'?'<span class="source-tag">代申请</span>':'';return `<article class="record"><div class="record-head"><b>${r.visitor} · ${r.type}</b>${source}<span class="status ${statusClass(r.status)}">${r.status}</span></div><div class="meta">${r.time}<br>${r.purpose} · 共 ${r.companions+1} 人 · ${r.vehicles.length} 辆车</div><div class="record-actions"><button class="inline-action" onclick="viewApplication('${r.id}')">详情</button>${actions}</div></article>`}
function findApplication(id){return (role==='visitor'?visitorApplications:hostApplications).find(r=>r.id===id)}
function detailHtml(r){return `<div class="detail"><div><label>申请编号</label><b>${r.id}</b></div><div><label>申请来源</label><span>${r.source==='被访人代申请'?'<span class="source-tag">代申请</span>':r.source}</span></div>${r.source==='被访人代申请'?`<div><label>账号绑定</label><span>${r.binding} · ${r.accountId||'待生成'}</span></div>`:''}<div><label>访客</label><span>${r.visitor}</span></div><div><label>被访人</label><span>${r.host}</span></div><div><label>拜访形式</label><span>${r.type}</span></div><div><label>拜访时间</label><span>${r.time}</span></div><div><label>来访目的</label><span>${r.purpose}</span></div><div><label>同行人数</label><span>${r.companions} 人（不含本人）</span></div><div><label>同行车辆</label><span>${r.vehicles.length?r.vehicles.join('、'):'无'}</span></div><div><label>当前状态</label><span>${r.status}</span></div></div>`}
function openSheet(title,body,actions='<button class="secondary" onclick="closeSheet()">关闭</button>'){lastFocusedElement=document.activeElement;sheetTitle.textContent=title;sheetBody.innerHTML=body;sheetActions.innerHTML=actions;mask.classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.sheet input:not([disabled]),.sheet textarea,.sheet button')?.focus(),0)}function closeSheet(){mask.classList.remove('open');document.body.style.overflow='';lastFocusedElement?.focus()}
function viewApplication(id){const r=findApplication(id);openSheet('申请详情',detailHtml(r))}
function review(id){const r=findApplication(id);openSheet('审核访问申请',detailHtml(r)+`<div class="field" style="margin-top:14px"><label>拒绝原因（拒绝时必填）</label><textarea class="textarea" id="rejectReason"></textarea></div>`,`<button class="danger" onclick="rejectApplication('${id}')">拒绝</button><button class="primary" onclick="approveApplication('${id}')">通过</button>`)}
function approveApplication(id){const r=findApplication(id);r.status=r.type==='多次拜访'?'生效中':'待来访';closeSheet();render('applications');showToast('审核通过，已短信通知访客')}function rejectApplication(id){if(!rejectReason.value.trim())return showToast('请填写拒绝原因');const r=findApplication(id);r.status='审核失败';closeSheet();render('applications');showToast('已拒绝并短信通知访客')}
function cancelInvite(id){const r=findApplication(id);r.status='已撤销';render('applications');showToast('代申请已撤销，未发生的通行权限同步失效')}function terminate(id){const r=findApplication(id);r.status='已终止';render('applications');showToast('剩余授权已终止，历史访问记录保留')}
function showCode(id,status){openSheet(status==='来访中'?'出访二维码':'来访二维码',`<div class="qr"><svg class="ui-icon"><use href="#i-qr"/></svg></div><p style="text-align:center">${id}</p><div class="note">二维码仅在当前企业授权通行点和有效期内使用。</div>`)}
function accessView(){const source=accessData[role],q=accessQuery.trim().toLowerCase(),filters=['全部','来访中','已结束','单次拜访','多次拜访'],rows=source.map((r,i)=>({r,i})).filter(x=>(activeAccessFilter==='全部'||x.r.status===activeAccessFilter||x.r.type===activeAccessFilter)&&(!q||Object.values(x.r).join(' ').toLowerCase().includes(q)));return `<section class="view active"><div class="section-head"><div><h2>访问记录</h2><p>${role==='visitor'?'本人已发生的实际进出记录':'实际访问本人的访客进出记录'}</p></div><span class="count">${rows.length} 条</span></div><div class="search"><svg class="ui-icon"><use href="#i-search"/></svg><input aria-label="搜索访问记录" value="${accessQuery}" oninput="setAccessQuery(this.value)" placeholder="${role==='visitor'?'被访人':'访客姓名或手机号'}"></div><div class="chips">${filters.map(f=>`<button class="chip ${f===activeAccessFilter?'active':''}" onclick="setAccessFilter('${f}')">${f}</button>`).join('')}</div>${rows.length?rows.map(x=>{const times=x.r.time.split(' / ');return `<article class="record"><div class="record-head"><b>${role==='visitor'?x.r.company+' · '+x.r.host:x.r.visitor+' · '+x.r.company}</b><span class="status ${statusClass(x.r.status)}">${x.r.status}</span></div><div class="meta">${x.r.type}<br><span class="direction-tag in">进</span> ${times[0]}　<span class="direction-tag out">出</span> ${times[1]}<br>${x.r.point}<br>共 ${x.r.companions+1} 人 · ${x.r.vehicles} 辆车</div><div class="record-actions"><button class="inline-action" onclick="viewAccess(${x.i})">查看详情</button></div></article>`}).join(''):'<div class="empty">暂无符合条件的访问记录<br><button class="inline-action" onclick="clearAccessFilters()">清空筛选</button></div>'}</section>`}
function setAccessFilter(filter){activeAccessFilter=filter;render('access')}function setAccessQuery(value){accessQuery=value;render('access');const input=document.querySelector('.search input');input?.focus();input?.setSelectionRange(value.length,value.length)}function clearAccessFilters(){activeAccessFilter='全部';accessQuery='';render('access')}
function viewAccess(index){const r=accessData[role][index],times=r.time.split(' / ');openSheet('访问记录详情',`<div class="detail"><div><label>访客</label><span>${r.visitor}</span></div><div><label>被访人</label><span>${r.host}</span></div><div><label>单位</label><span>${r.company}</span></div><div><label>拜访形式</label><span>${r.type}</span></div><div><label>进入记录</label><span><span class="direction-tag in">进</span> ${times[0]}</span></div><div><label>离开记录</label><span><span class="direction-tag out">出</span> ${times[1]}</span></div><div><label>通行点</label><span>${r.point}</span></div><div><label>同行人数</label><span>${r.companions} 人</span></div><div><label>通行车辆</label><span>${r.vehicles} 辆</span></div><div><label>状态</label><span>${r.status}</span></div></div>`)}
function profileView(){return `<section class="view active"><div class="section-head"><div><h2>个人信息</h2><p>账号资料与安全设置</p></div></div><div class="card"><div class="profile-head"><div class="avatar">${role==='visitor'?'张':'李'}</div><div><b>${role==='visitor'?'张晨':'李敏'}</b><span>${role==='visitor'?'访客身份 VIS-000001':'产品研发部 · EMP-000001'}</span></div></div></div><div class="card"><dl class="info-list">${role==='visitor'?'<div><dt>手机号</dt><dd>138****6201</dd></div><div><dt>访客单位</dt><dd>上海远航科技</dd></div><div><dt>身份证号</dt><dd>310***********2018</dd></div>':'<div><dt>所属企业</dt><dd>华辰科技有限公司</dd></div><div><dt>所属部门</dt><dd>产品研发部</dd></div><div><dt>手机号</dt><dd>138****2071</dd></div><div><dt>可作为被访人</dt><dd>是</dd></div><div><dt>拜访通行点</dt><dd>北门、研发园区东门</dd></div>'}</dl></div><div class="card menu"><button onclick="showToast('已打开修改手机号')"><svg class="ui-icon"><use href="#i-phone"/></svg>修改手机号<svg class="ui-icon"><use href="#i-next"/></svg></button><button onclick="showToast('已打开修改密码')"><svg class="ui-icon"><use href="#i-lock"/></svg>修改密码<svg class="ui-icon"><use href="#i-next"/></svg></button><button onclick="showToast('已打开隐私政策')"><svg class="ui-icon"><use href="#i-shield"/></svg>隐私政策与用户协议<svg class="ui-icon"><use href="#i-next"/></svg></button><button onclick="showToast('已退出当前企业访客通')"><svg class="ui-icon"><use href="#i-logout"/></svg>退出登录<svg class="ui-icon"><use href="#i-next"/></svg></button></div><div class="note">当前企业实例：华辰科技有限公司。账号、申请和通行数据仅在本企业范围内使用，不提供身份或企业切换。</div></section>`}
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&mask.classList.contains('open'))closeSheet()});if(window.visualViewport){const baseHeight=window.visualViewport.height;window.visualViewport.addEventListener('resize',()=>document.body.classList.toggle('keyboard-open',window.visualViewport.height<baseHeight*.75))}
render('apply');
</script></body></html>
