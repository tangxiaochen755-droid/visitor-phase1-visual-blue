<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>被访人端</title><link href="../assets/remixicon/remixicon.css" rel="stylesheet"><style>
:root{--ink:#202327;--muted:#737981;--line:#dfe2e5;--soft:#f4f5f6;--dark:#292d31;--warn:#8a6419;--warnbg:#faf4e7;--bad:#9a3f3f;--badbg:#faeeee;--ok:#3d6b55;--okbg:#edf5f0}*{box-sizing:border-box}body{margin:0;background:#e9ebed;color:var(--ink);font:14px "PingFang SC","Microsoft YaHei",sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--soft)}.top{height:138px;background:var(--dark);color:#fff;padding:22px 20px}.topbar{display:flex;align-items:center}.brand{font-size:16px;font-weight:600}.account{margin-left:auto;border:0;background:#3b4045;color:#fff;border-radius:18px;padding:7px 12px}.greet{margin-top:24px}.greet b{font-size:22px;display:block}.greet span{display:block;color:#c8ccd0;margin-top:5px;font-size:12px}.view{padding:16px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-32px;margin-bottom:16px}.summary div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 8px;text-align:center}.summary b{font:600 23px ui-monospace,SFMono-Regular,Menlo,monospace;display:block}.summary span{font-size:11px;color:var(--muted)}.section-title{font-size:18px;font-weight:600}.section-sub{font-size:12px;color:var(--muted);margin:4px 0 14px}.search{height:42px;background:#fff;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;padding:0 12px;margin-bottom:10px}.search input{border:0;outline:0;flex:1;padding-left:8px}.filter{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.chip{white-space:nowrap;border:1px solid #d3d6d9;background:#fff;border-radius:16px;padding:6px 11px;color:#686e75}.chip.active{background:#303439;color:#fff}.record{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px}.record-head{display:flex}.status{margin-left:auto;border-radius:11px;padding:3px 8px;font-size:11px;background:#eee}.status.warn{background:var(--warnbg);color:var(--warn)}.status.ok{background:var(--okbg);color:var(--ok)}.status.bad{background:var(--badbg);color:var(--bad)}.meta{color:var(--muted);font-size:12px;line-height:1.8;margin-top:8px}.actions{display:flex;gap:8px;margin-top:10px}.btn{height:38px;border:1px solid #cdd1d5;background:#fff;border-radius:6px;padding:0 15px}.btn.primary{background:#303439;color:#fff}.btn.danger{color:#8d3c3c}.mask{position:fixed;inset:0;background:rgba(20,22,24,.45);display:none;align-items:flex-end;justify-content:center}.mask.open{display:flex}.sheet{width:min(100%,430px);max-height:84vh;overflow:auto;background:#fff;border-radius:14px 14px 0 0;padding:19px}.sheet-head{display:flex;margin-bottom:16px;font-size:16px;font-weight:600}.close{margin-left:auto;border:0;background:none;font-size:22px}.detail{display:grid;grid-template-columns:92px 1fr;gap:11px 8px}.detail label{color:var(--muted)}.field{margin-top:14px}.input,.textarea{width:100%;border:1px solid #ccd0d4;border-radius:6px;padding:10px}.textarea{height:78px}.sheet-actions{display:flex;gap:8px;margin-top:18px}.sheet-actions .btn{flex:1}.note{margin-top:12px;padding:10px;background:#f7f8f9;border-left:3px solid #777;color:#666;font-size:12px}.toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:#262a2e;color:#fff;padding:11px 18px;border-radius:6px;display:none}.toast.show{display:block}@media(min-width:700px){body{padding:24px}.app{min-height:calc(100vh - 48px);border-radius:18px;overflow:hidden}}
</style></head><body><div class="app"><header class="top"><div class="topbar"><div class="brand">华辰访客 · 被访人</div><button class="account" onclick="accountMask.classList.add('open')"><i class="ri-user-line"></i> 李敏</button></div><div class="greet"><b>来访申请记录</b><span>审核结果将通过短信通知访客</span></div></header><main class="view"><div class="summary"><div><b id="pendingCount">2</b><span>待审核</span></div><div><b>4</b><span>今日来访</span></div><div><b>1</b><span>来访中</span></div></div><div class="section-title">申请列表</div><div class="section-sub">支持单次和多次拜访；多次拜访在有效期内可重复访问</div><div class="search"><i class="ri-search-line"></i><input id="searchInput" placeholder="访客姓名或手机号" oninput="renderRecords()"></div><div class="filter"><button class="chip active" data-status="全部" onclick="selectFilter(this)">全部</button><button class="chip" data-status="待审核" onclick="selectFilter(this)">待审核</button><button class="chip" data-status="生效中" onclick="selectFilter(this)">生效中</button><button class="chip" data-status="来访中" onclick="selectFilter(this)">来访中</button></div><div id="recordList"></div></main></div>
<div class="mask" id="detailMask" onclick="if(event.target===this)closeAll()"><div class="sheet"><div class="sheet-head" id="detailTitle">申请详情<button class="close" onclick="closeAll()">×</button></div><div id="detailBody"></div></div></div>
<div class="mask" id="accountMask" onclick="if(event.target===this)this.classList.remove('open')"><div class="sheet"><div class="sheet-head">账户设置<button class="close" onclick="accountMask.classList.remove('open')">×</button></div><div class="detail"><label>员工姓名</label><b>李敏</b><label>身份编码</label><span>EMP-000001</span><label>所属部门</label><span>产品研发部</span><label>手机号</label><span>138****2071</span><label>登录方式</label><span>手机号＋密码、手机号＋验证码（开户时确定）</span></div><div class="sheet-actions"><button class="btn" onclick="toast('进入修改密码')">修改密码</button><button class="btn" onclick="openPhone()">换绑手机号</button></div></div></div><div class="toast" id="toast"></div>
<script>
let selected='全部',current=null;const records=[{id:'VS202608040031',type:'多次拜访',name:'陈浩',phone:'138****7812',company:'顺达供应链有限公司',date:'08-05 至 08-30；08:30-17:30',points:'总部园区 / 北门',purpose:'货物配送',car:'沪D372K8',status:'待审核'},{id:'VS202608040030',type:'单次拜访',name:'周悦',phone:'139****1166',company:'星云数字科技',date:'08-05 13:30-15:00',points:'总部园区 / 南门',purpose:'项目交流',car:'无',status:'待审核'},{id:'VS202608020018',type:'多次拜访',name:'林清',phone:'177****1068',company:'长期服务商',date:'08-03 至 08-31；08:30-17:30',points:'总部园区 / 北门、研发园区 / 东门',purpose:'驻场服务',car:'无',status:'生效中'}];
function selectFilter(btn){selected=btn.dataset.status;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===btn));renderRecords()}function cls(s){return s==='待审核'?'warn':s==='来访中'||s==='生效中'?'ok':s==='审核失败'||s==='已失效'?'bad':''}function renderRecords(){const q=searchInput.value.trim();const rows=records.filter(r=>(selected==='全部'||r.status===selected)&&(!q||(r.name+r.phone).includes(q)));recordList.innerHTML=rows.length?rows.map(r=>`<article class="record"><div class="record-head"><b>${r.name} · ${r.type}</b><span class="status ${cls(r.status)}">${r.status}</span></div><div class="meta">${r.company} · ${r.phone}<br>${r.date}<br>${r.purpose} · ${r.points}</div><div class="actions"><button class="btn" onclick="openDetail('${r.id}')">查看详情</button>${r.status==='待审核'?`<button class="btn primary" onclick="openReview('${r.id}')">处理申请</button>`:''}</div></article>`).join(''):'<div class="record">暂无符合条件的申请</div>';pendingCount.textContent=records.filter(x=>x.status==='待审核').length}function detailHtml(r){return `<div class="detail"><label>申请编号</label><b>${r.id}</b><label>拜访形式</label><span>${r.type}</span><label>访客姓名</label><span>${r.name}</span><label>访客单位</label><span>${r.company}</span><label>手机号</label><span>${r.phone}</span><label>拜访时间</label><span>${r.date}</span><label>拜访通行点</label><span>${r.points}</span><label>来访目的</label><span>${r.purpose}</span><label>车辆</label><span>${r.car}</span><label>当前状态</label><span class="status ${cls(r.status)}" style="margin:0;width:max-content">${r.status}</span></div>`}function openDetail(id){current=records.find(x=>x.id===id);detailTitle.childNodes[0].nodeValue='申请详情';detailBody.innerHTML=detailHtml(current)+(current.type==='多次拜访'?'<div class="note">多次拜访审核通过后，在有效期内可重复完成来访与出访；每次通行均由后台独立记录。</div>':'');detailMask.classList.add('open')}function openReview(id){current=records.find(x=>x.id===id);detailTitle.childNodes[0].nodeValue='审核来访申请';detailBody.innerHTML=detailHtml(current)+`<div class="field"><label>拒绝原因（拒绝时必填）</label><textarea class="textarea" id="reason"></textarea></div><div class="sheet-actions"><button class="btn danger" onclick="reject()">拒绝</button><button class="btn primary" onclick="approve()">通过</button></div>`;detailMask.classList.add('open')}function approve(){current.status=current.type==='多次拜访'?'生效中':'待来访';closeAll();renderRecords();toast('审核通过，已生成二维码并短信通知访客')}function reject(){if(!reason.value.trim())return toast('请填写拒绝原因');current.status='审核失败';closeAll();renderRecords();toast('已拒绝申请并短信通知访客')}function closeAll(){detailMask.classList.remove('open')}function openPhone(){accountMask.classList.remove('open');detailTitle.childNodes[0].nodeValue='换绑手机号';detailBody.innerHTML=`<div class="field"><label>原手机号</label><input class="input" value="13800002071" disabled></div><div class="field"><label>验证码</label><input class="input" placeholder="原型验证码 123456"></div><div class="field"><label>新手机号</label><input class="input" placeholder="请输入新手机号"></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="toast('手机号修改成功，身份编码保持不变');closeAll()">确认修改</button>`;detailMask.classList.add('open')}let timer;function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),1800)}renderRecords();
</script></body></html>
