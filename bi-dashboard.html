Status||(index%4===0?'来访结束':'来访中')):(noShow?'来访结束':'待来访'),entryRecords})}records.push({reservationId:'RSV-CANCELLED',appointmentStart:dateAt(now,9).toISOString(),appointmentEnd:dateAt(now,10).toISOString(),approvalStatus:'审核通过',cancelled:true,terminated:false,entryRecords:[]});records.push({reservationId:'RSV-REJECTED',appointmentStart:dateAt(now,11).toISOString(),appointmentEnd:dateAt(now,12).toISOString(),approvalStatus:'审核拒绝',cancelled:false,terminated:false,entryRecords:[]});return records}

function validEntryRecords(item){const seen=new Set();return (item.entryRecords||[]).filter(event=>event.direction==='进入'&&event.result==='success'&&!seen.has(event.eventId)&&seen.add(event.eventId))}
function isEffectiveReservation(item){return item.approvalStatus==='审核通过'&&!item.cancelled&&!item.terminated}
function overlapsToday(item,now=new Date()){const start=dateAt(now,0),end=dateAt(now,24);return new Date(item.appointmentStart)<end&&new Date(item.appointmentEnd)>=start}
function arrivalState(item,now=new Date()){if(validEntryRecords(item).length)return 'arrived';return new Date(item.appointmentEnd)>now?'pending':'noShow'}
function todayReservations(now=new Date()){return ReservationSource.filter(item=>isEffectiveReservation(item)&&overlapsToday(item,now))}
function summarizeToday(now=new Date()){const list=todayReservations(now),summary={expected:list.length,arrived:0,pending:0,noShow:0};list.forEach(item=>summary[arrivalState(item,now)]++);return summary}
DashboardData.today=summarizeToday();
class ResizeManager{constructor(){this.listeners=new Set()}add(fn){this.listeners.add(fn)}notify(){this.listeners.forEach(fn=>fn())}}
class ScreenAdapter{constructor(screen,manager){this.screen=screen;this.manager=manager;this.onResize=this.resize.bind(this);window.addEventListener('resize',this.onResize);document.addEventListener('fullscreenchange',this.onResize);this.resize()}resize(){const scale=Math.min(innerWidth/LayoutConfig.designWidth,innerHeight/LayoutConfig.designHeight);const left=Math.max(0,(innerWidth-LayoutConfig.designWidth*scale)/2);const top=Math.max(0,(innerHeight-LayoutConfig.designHeight*scale)/2);this.screen.style.transform=`translate(${left}px,${top}px) scale(${scale})`;this.manager.notify()}}
const resizeManager=new ResizeManager();new ScreenAdapter(document.getElementById('screen'),resizeManager);
const DashboardConfigDefaults={enabled:true,title:'访客管理可视化大屏',refreshInterval:30,listLimit:8,showDemoScan:true,rightTop:'overview',rightBottom:'trend',trendPalette:'standard'};
function readDashboardConfig(){try{return {...DashboardConfigDefaults,...JSON.parse(localStorage.getItem('phase1_bi_dashboard_config')||'{}')}}catch(e){return {...DashboardConfigDefaults}}}
const dashboardConfig=readDashboardConfig();
function applyBrand(){companyName.textContent='江苏联环药业';brandLogo.src='./assets/jiangsu-lianhuan-pharma-logo.png';brandLogo.alt='江苏联环药业 Logo';brandLogo.onerror=()=>{brandLogo.onerror=null;brandLogo.src='./assets/visitor-pass-logo-official.png'}}
function applyDashboardConfig(){screenTitle.textContent=dashboardConfig.title||DashboardConfigDefaults.title;demoScan.hidden=!dashboardConfig.showDemoScan;trendPanel.style.gridRow=dashboardConfig.rightTop==='trend'?'1':'2';overviewPanel.style.gridRow=dashboardConfig.rightTop==='overview'?'1':'2';document.querySelector('.footer-note').textContent=`数据每 ${dashboardConfig.refreshInterval} 秒刷新 · 当前为标品演示数据`;const preview=new URLSearchParams(location.search).get('preview')==='1';disabledState.classList.toggle('active',!dashboardConfig.enabled&&!preview)}
const visitStatusSemantic={'待来访':'info','来访中':'success','来访结束':'neutral','已过期':'neutral','已终止':'warning'};
const leftState={view:'reservations',filter:'all',scrollTop:0};let currentRenderedItems=[];
const arrivalMeta={pending:{label:'待到访',semantic:'info'},arrived:{label:'已到访',semantic:'success'},noShow:{label:'未到访',semantic:'neutral'}};
function reservationTime(item){const entries=validEntryRecords(item),latest=entries.at(-1);return `<div class="time-cell"><b>预约 ${formatTime(item.appointmentStart)}–${formatTime(item.appointmentEnd)}</b><small>${latest?`识别 ${formatTime(latest.occurredAt)}`:'尚无有效入场记录'}</small></div>`}
function reservationFor(item){return item.appointmentStart?item:ReservationSource.find(record=>record.reservationId===item.reservationId)}
function recognitionTime(item){const reservation=reservationFor(item);return reservation?`<div class="time-cell"><b>预约 ${formatTime(reservation.appointmentStart)}–${formatTime(reservation.appointmentEnd)}</b><small>识别 ${item.time}</small></div>`:`<div class="time-cell"><b>预约时间待同步</b><small>识别 ${item.time}</small></div>`}
function rowHtml(item,index,view){const reservation=reservationFor(item)||item,state=view==='reservations'?arrivalState(item):'arrived',time=view==='reservations'?reservationTime(item):recognitionTime(item),interactive=view==='recognitions';return `<div class="activity-row${interactive?' is-detail-link':''}" ${interactive?'role="button" tabindex="0" aria-label="查看当前访客详情"':''} data-index="${index}" data-arrival="${state}"><div class="person"><span class="avatar">${item.name.slice(-1)}</span><b>${item.name}</b></div><span>${item.mobile}</span>${time}<span>******${item.idTail}</span><span class="ellipsis">${item.company}</span><span>${reservation.visitorCount||1} 人</span><span>${item.host}</span><span class="ellipsis muted">${item.department}</span><span class="status ${visitStatusSemantic[item.visitStatus]||'neutral'}">${item.visitStatus}</span></div>`}
function filteredReservations(){const order={pending:0,arrived:1,noShow:2};return todayReservations().filter(item=>leftState.filter==='all'||arrivalState(item)===leftState.filter).sort((a,b)=>order[arrivalState(a)]-order[arrivalState(b)]||new Date(a.appointmentStart)-new Date(b.appointmentStart))}
function renderReservationFilters(){const summary=summarizeToday(),items=[['all','全部',summary.expected],['pending','待到访',summary.pending],['arrived','已到访',summary.arrived],['noShow','未到访',summary.noShow]];reservationFilters.hidden=leftState.view!=='reservations';reservationFilters.innerHTML=items.map(([key,label,count])=>`<button class="filter-chip ${leftState.filter===key?'active':''}" type="button" data-filter="${key}" aria-pressed="${leftState.filter===key}">${label} ${count}</button>`).join('');reservationFilters.querySelectorAll('.filter-chip').forEach(button=>button.addEventListener('click',()=>{leftState.filter=button.dataset.filter;leftState.scrollTop=0;renderActivities()}))}
function renderActivities(){document.querySelectorAll('.view-tab').forEach(button=>{const active=button.dataset.view===leftState.view;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});renderReservationFilters();let total=0;if(leftState.view==='reservations'){currentRenderedItems=filteredReservations();total=currentRenderedItems.length}else{currentRenderedItems=DashboardData.recognitions.slice(0,dashboardConfig.listLimit);total=DashboardData.recognitions.length}activityList.innerHTML=currentRenderedItems.length?currentRenderedItems.map((item,index)=>rowHtml(item,index,leftState.view)).join(''):'<div class="list-empty">暂无符合条件的记录</div>';activityList.querySelectorAll('.is-detail-link').forEach(row=>{const open=()=>showDetail(currentRenderedItems[Number(row.dataset.index)]);row.addEventListener('click',open);row.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open()}})});const filterLabel=leftState.filter==='all'?' · 待到访优先':` · ${arrivalMeta[leftState.filter].label}`;listSummary.textContent=leftState.view==='reservations'?`共 ${total} 条当日有效预约${filterLabel}`:`展示最近 ${currentRenderedItems.length} 条 · 共 ${total} 条识别事件`;requestAnimationFrame(()=>{activityList.scrollTop=leftState.scrollTop;scrollHint.hidden=activityList.scrollHeight<=activityList.clientHeight})}
function renderVisitorInfo(item){const reservation=reservationFor(item)||item,detailTime=reservation.appointmentStart?`${formatTime(reservation.appointmentStart)}–${formatTime(reservation.appointmentEnd)}`:'待同步';return `<div class="detail-grid"><div class="detail-item"><label>访客姓名</label><b>${item.name||'—'}</b></div><div class="detail-item"><label>手机号</label><b>${item.mobile||'—'}</b></div><div class="detail-item"><label>预约来访时间</label><b>${detailTime}</b></div><div class="detail-item"><label>身份证</label><b>${item.idTail?`******${item.idTail}`:'—'}</b></div><div class="detail-item"><label>来访事由</label><b>${reservation.purpose||item.purpose||'—'}</b></div><div class="detail-item"><label>来访单位</label><b>${item.company||'—'}</b></div><div class="detail-item"><label>来访人数</label><b>${reservation.visitorCount||1} 人</b></div><div class="detail-item"><label>被访人姓名</label><b>${item.host||'—'}</b></div><div class="detail-item"><label>部门</label><b>${item.department||'—'}</b></div></div>`}
function showDetail(item){leftState.scrollTop=activityList.scrollTop;liveTitle.textContent='当前访客详情';liveHint.textContent='实时访客动态记录';activityView.classList.add('hidden');scanResultView.classList.remove('active');detailView.classList.add('active');detailContent.innerHTML=`${renderVisitorInfo(item)}<button class="back-btn" id="backToList"><i class="ri-arrow-left-line"></i> 返回实时访客动态</button>`;backToList.addEventListener('click',showList)}
const scanStatusMeta={success:{label:'扫码成功',message:'身份核验通过，可正常通行',semantic:'success',icon:'ri-checkbox-circle-line'},failed:{label:'扫码失败',message:'未完成二维码核验，请联系现场工作人员',semantic:'danger',icon:'ri-close-circle-line'},expired:{label:'二维码已失效',message:'当前二维码已超过有效期，请重新获取',semantic:'danger',icon:'ri-error-warning-line'}};
function showScanResult(item,status='success'){leftState.scrollTop=activityList.scrollTop;const meta=scanStatusMeta[status]||scanStatusMeta.failed;liveTitle.textContent='扫码结果';liveHint.textContent='通行核验与访客信息';activityView.classList.add('hidden');detailView.classList.remove('active');scanResultView.classList.add('active');scanResultContent.innerHTML=`<div class="scan-status-card ${meta.semantic}" data-scan-status="${status}"><i class="${meta.icon}" aria-hidden="true"></i><div><strong>${meta.label}</strong><p>${meta.message}</p></div></div>${renderVisitorInfo(item)}<button class="back-btn" id="backFromScan"><i class="ri-arrow-left-line"></i> 返回今日访客一览</button>`;backFromScan.addEventListener('click',showList)}
function showList(){liveTitle.textContent='今日访客一览';liveHint.textContent='当日有效预约与最近识别';detailView.classList.remove('active');scanResultView.classList.remove('active');activityView.classList.remove('hidden');renderActivities()}
function validateTodayMetrics(){const d=DashboardData.today;if(d.expected!==d.arrived+d.pending+d.noShow)throw new Error('今日访客概况口径不一致：应到必须等于已到访、待到访与未到访之和')}
function renderMetrics(){validateTodayMetrics();metrics.innerHTML=DashboardData.metrics.map(item=>`<div class="metric"><div class="metric-top"><span class="metric-icon"><i class="${item.icon}"></i></span>${item.label}</div><b>${DashboardData.today[item.key]}<em>人</em></b><small>${item.note}</small></div>`).join('')}
let trendChartInstance;
function setTrendRange(range){const d=DashboardData.trends[range]||DashboardData.trends.week;trendHint.textContent=d.hint;document.querySelectorAll('.trend-tab').forEach(button=>{const active=button.dataset.range===range;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});trendChartInstance.setOption({xAxis:{data:d.labels},series:[{data:d.expected},{data:d.arrived}]})}
function initChart(){const chart=echarts.init(document.getElementById('trendChart'),null,{renderer:'canvas'}),styles=getComputedStyle(document.documentElement),primary=styles.getPropertyValue('--color-brand-primary').trim(),strong=styles.getPropertyValue('--color-brand-primary-strong').trim(),focus=styles.getPropertyValue('--color-border-focus').trim(),info=styles.getPropertyValue('--color-status-info-text').trim(),secondary=styles.getPropertyValue('--color-text-secondary').trim(),border=styles.getPropertyValue('--color-border-default').trim(),soft=styles.getPropertyValue('--color-border-soft').trim(),ink=styles.getPropertyValue('--color-text-primary').trim(),palette=dashboardConfig.trendPalette==='soft'?[focus,info]:[primary,strong];chart.setOption({animationDuration:500,animationDurationUpdate:420,color:palette,tooltip:{trigger:'axis',backgroundColor:'rgba(255,255,255,.9)',borderColor:border,borderWidth:1,extraCssText:'backdrop-filter:blur(10px);box-shadow:0 10px 28px rgba(30,70,110,.14);border-radius:10px;',textStyle:{color:ink,fontSize:14},valueFormatter:value=>`${value} 人`},legend:{top:8,right:18,itemWidth:14,itemHeight:6,itemGap:18,textStyle:{color:secondary,fontSize:13},data:['有效预约应到','实际到访']},grid:{left:40,right:24,top:58,bottom:28,containLabel:true},xAxis:{type:'category',boundaryGap:false,data:[],axisLine:{lineStyle:{color:border}},axisTick:{show:false},axisLabel:{color:secondary,fontSize:13,margin:14}},yAxis:{type:'value',min:0,splitNumber:4,axisLine:{show:false},axisTick:{show:false},axisLabel:{color:secondary,fontSize:12},splitLine:{lineStyle:{color:soft,width:1,type:'dashed'}}},series:[{name:'有效预约应到',type:'line',smooth:.55,smoothMonotone:'x',data:[],symbol:'circle',symbolSize:5,lineStyle:{width:2.5,cap:'round',join:'round'},itemStyle:{borderWidth:2,borderColor:'#fff'}},{name:'实际到访',type:'line',smooth:.55,smoothMonotone:'x',data:[],symbol:'circle',symbolSize:5,lineStyle:{width:2.5,cap:'round',join:'round'},itemStyle:{borderWidth:2,borderColor:'#fff'}}]});trendChartInstance=chart;setTrendRange('week');document.querySelectorAll('.trend-tab').forEach(button=>button.addEventListener('click',()=>setTrendRange(button.dataset.range)));resizeManager.add(()=>chart.resize());return chart}
function syncSummaryAfterEntry(){DashboardData.today=summarizeToday();DashboardData.trends.week.expected.at(-1)!==DashboardData.today.expected&&(DashboardData.trends.week.expected[DashboardData.trends.week.expected.length-1]=DashboardData.today.expected);DashboardData.trends.week.arrived[DashboardData.trends.week.arrived.length-1]=DashboardData.today.arrived;const todayArrived=DashboardData.trends.today.arrived,delta=DashboardData.today.arrived-todayArrived.reduce((sum,value)=>sum+value,0);todayArrived[todayArrived.length-1]+=delta;renderMetrics();const activeRange=document.querySelector('.trend-tab.active')?.dataset.range||'week';setTrendRange(activeRange)}
function handleRecognitionEvent(event){if(DashboardData.recognitions.some(item=>item.eventId===event.eventId))return false;DashboardData.recognitions.unshift(event);const reservation=ReservationSource.find(item=>item.reservationId===event.reservationId);if(reservation&&event.direction==='进入'&&event.result==='success'&&!validEntryRecords(reservation).some(item=>item.eventId===event.eventId)){reservation.entryRecords.push({eventId:event.eventId,direction:event.direction,result:event.result,occurredAt:event.occurredAt});reservation.visitStatus='来访中';syncSummaryAfterEntry()}renderActivities();return true}
let demoScanStateIndex=0;
function simulateScan(){const statuses=['success','failed','expired'],status=statuses[demoScanStateIndex%statuses.length];demoScanStateIndex++;const reservation=todayReservations().find(item=>arrivalState(item)==='pending')||todayReservations()[0],now=new Date();if(status==='success'){const event={eventId:`EVT-DEMO-${now.getTime()}`,reservationId:reservation.reservationId,name:reservation.name,mobile:reservation.mobile,time:now.toLocaleTimeString('zh-CN',{hour12:false}),occurredAt:now.toISOString(),idTail:reservation.idTail,company:reservation.company,host:reservation.host,department:reservation.department,purpose:reservation.purpose,visitStatus:'来访中',direction:'进入',result:'success'};handleRecognitionEvent(event)}showScanResult(reservation,status)}
function updateClock(){const now=new Date(),week=['日','一','二','三','四','五','六'];currentTime.textContent=now.toLocaleTimeString('zh-CN',{hour12:false});currentDate.textContent=`${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日 星期${week[now.getDay()]}`}
document.querySelectorAll('.view-tab').forEach(button=>button.addEventListener('click',()=>{leftState.view=button.dataset.view;leftState.scrollTop=0;renderActivities()}));activityList.addEventListener('scroll',()=>{leftState.scrollTop=activityList.scrollTop});demoScan.addEventListener('click',simulateScan);fullscreen.addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
applyBrand();applyDashboardConfig();renderActivities();renderMetrics();initChart();updateClock();setInterval(updateClock,1000);
</script>
